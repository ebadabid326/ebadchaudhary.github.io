<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ebad Gaming - Admin</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#080812;color:#fff;margin:0;padding:20px}.container{max-width:900px;margin:35px auto}.box{background:#11111d;border:1px solid #29293d;border-radius:18px;padding:28px}h1{text-align:center;margin-bottom:22px}input,select{width:100%;padding:12px;margin:7px 0 16px;background:#0c0c15;color:#fff;border:1px solid #3a3a50;border-radius:8px}button,a{display:inline-block;background:#ff3030;color:#fff;border:0;border-radius:9px;padding:12px 20px;font-weight:bold;text-decoration:none;cursor:pointer}.message{text-align:center;min-height:28px;color:#72f3a1;margin:12px}#panel{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.note{color:#aaa;font-size:14px;margin-bottom:18px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body><div class="container">
<div class="box" id="loginBox"><h1>🔐 Ebad Gaming Admin</h1><p class="note">Enter the admin password to open the control panel.</p><input id="password" type="password" placeholder="Admin Password"><button onclick="login()">Login</button><a href="index.html" style="margin-left:8px">← Website</a><div class="message" id="loginMsg"></div></div>
<div class="box" id="panel"><h1>⚙️ Control Panel</h1><div class="grid">
<div class="full"><label>Website Name</label><input id="siteInput"></div><div class="full"><label>Hero Description</label><input id="heroInput"></div>
<div><label>Game 1 Name</label><input id="g1nInput"></div><div><label>Game 1 Description</label><input id="g1dInput"></div>
<div><label>Game 2 Name</label><input id="g2nInput"></div><div><label>Game 2 Description</label><input id="g2dInput"></div>
<div><label>Game 3 Name</label><input id="g3nInput"></div><div><label>Game 3 Description</label><input id="g3dInput"></div>
<div><label>Game 4 Name</label><input id="g4nInput"></div><div><label>Game 4 Description</label><input id="g4dInput"></div>
<div class="full"><label>Main Color</label><select id="colorInput"><option value="#ff3030">Red</option><option value="#00aaff">Blue</option><option value="#00cc77">Green</option><option value="#aa55ff">Purple</option><option value="#ff8800">Orange</option><option value="#ff33aa">Pink</option></select></div>
</div><button onclick="save()">💾 Save Changes</button><a href="index.html" style="margin-left:8px">← Back to Website</a><div class="message" id="saveMsg"></div></div></div>
<script>
const PASSWORD="12345",defaults={site:"Ebad Gaming",hero:"Play exciting games, beat your high scores, and become the ultimate gamer.",g1n:"Space Rocket",g1d:"Fly your rocket and beat your score.",g2n:"Speed Racer",g2d:"Drive fast and avoid enemy cars.",g3n:"Zombie Attack",g3d:"Survive the zombie attack.",g4n:"Sword Battle",g4d:"Become the ultimate warrior.",color:"#ff3030"};
function get(k){return localStorage.getItem("ebad_"+k)||defaults[k]}
function login(){const p=document.getElementById("password").value;if(p===PASSWORD){document.getElementById("loginBox").style.display="none";document.getElementById("panel").style.display="block";load()}else document.getElementById("loginMsg").textContent="❌ Wrong password"}
function load(){document.getElementById("siteInput").value=get("site");document.getElementById("heroInput").value=get("hero");["g1n","g1d","g2n","g2d","g3n","g3d","g4n","g4d"].forEach(k=>document.getElementById(k+"Input").value=get(k));document.getElementById("colorInput").value=get("color")}
function save(){["site","hero","g1n","g1d","g2n","g2d","g3n","g3d","g4n","g4d"].forEach(k=>localStorage.setItem("ebad_"+k,document.getElementById(k+"Input").value.trim()||defaults[k]));localStorage.setItem("ebad_color",document.getElementById("colorInput").value);document.getElementById("saveMsg").textContent="✅ Changes saved on this browser"}
</script></body></html>
