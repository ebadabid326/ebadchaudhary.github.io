<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ebad Gaming - Admin</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080812;
    color:#fff;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:950px;
    margin:35px auto;
}

.box{
    background:#11111d;
    border:1px solid #29293d;
    border-radius:18px;
    padding:28px;
    box-shadow:0 18px 45px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    margin-bottom:22px;
}

.subtitle{
    text-align:center;
    color:#999;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:6px;
    color:#ccc;
    font-weight:700;
}

input,
select{
    width:100%;
    padding:13px 14px;
    margin:7px 0 16px;
    background:#0c0c15;
    color:#fff;
    border:1px solid #3a3a50;
    border-radius:8px;
    outline:none;
    font-size:16px;
}

input:focus,
select:focus{
    border-color:#ff3030;
}

button,
a{
    display:inline-block;
    background:#ff3030;
    color:#fff;
    border:0;
    border-radius:9px;
    padding:12px 20px;
    font-weight:bold;
    text-decoration:none;
    cursor:pointer;
}

button:hover,
a:hover{
    filter:brightness(1.08);
}

.message{
    text-align:center;
    min-height:28px;
    color:#72f3a1;
    margin:12px;
}

.error{
    color:#ff7777;
}

#panel{
    display:none;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.full{
    grid-column:1/-1;
}

.section-title{
    font-size:20px;
    margin:5px 0 15px;
    color:#ff6666;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:8px;
}

.logout{
    background:#292c36;
    border:1px solid #464a59;
}

@media(max-width:650px){

    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .container{
        margin:10px auto;
    }
}

</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div class="box" id="loginBox">

<h1>
🔐 Ebad Gaming Admin
</h1>

<p class="subtitle">
Enter your admin password.
</p>

<label for="password">
Admin Password
</label>

<input
    id="password"
    type="password"
    placeholder="Enter password"
    autocomplete="off"
>

<div class="actions">

<button
    type="button"
    onclick="login()"
>
Login
</button>

<a href="index.html">
← Website
</a>

</div>

<div
    class="message"
    id="loginMsg"
>
</div>

</div>


<!-- PANEL -->

<div class="box" id="panel">

<h1>
⚙️ Ebad Gaming Control Panel
</h1>

<p class="subtitle">
Manage your website settings.
</p>


<div class="section-title">
🌐 Website
</div>

<div class="grid">

<div class="full">

<label>
Website Name
</label>

<input
    id="siteInput"
    type="text"
>

</div>

<div class="full">

<label>
Hero Description
</label>

<input
    id="heroInput"
    type="text"
>

</div>

</div>


<div class="section-title">
🎮 Games
</div>

<div class="grid">

<div>
<label>
Space Rocket Name
</label>

<input
    id="g1nInput"
    type="text"
>
</div>


<div>
<label>
Space Rocket Description
</label>

<input
    id="g1dInput"
    type="text"
>
</div>


<div>
<label>
Speed Racer Name
</label>

<input
    id="g2nInput"
    type="text"
>
</div>


<div>
<label>
Speed Racer Description
</label>

<input
    id="g2dInput"
    type="text"
>
</div>


<div>
<label>
Zombie Attack Name
</label>

<input
    id="g3nInput"
    type="text"
>
</div>


<div>
<label>
Zombie Attack Description
</label>

<input
    id="g3dInput"
    type="text"
>
</div>

</div>


<div class="section-title">
🎨 Main Color
</div>

<div class="grid">

<div class="full">

<select id="colorInput">

<option value="#ff3030">
Red
</option>

<option value="#00aaff">
Blue
</option>

<option value="#00cc77">
Green
</option>

<option value="#aa55ff">
Purple
</option>

<option value="#ff8800">
Orange
</option>

<option value="#ff33aa">
Pink
</option>

</select>

</div>

</div>


<div class="actions">

<button
    type="button"
    onclick="saveSettings()"
>
💾 Save Changes
</button>

<a href="index.html">
← Website
</a>

<button
    type="button"
    class="logout"
    onclick="logout()"
>
🚪 Logout
</button>

</div>


<div
    class="message"
    id="saveMsg"
>
</div>

</div>

</div>


<script>

/* =================================
   NEW ADMIN PASSWORD
================================= */

const ADMIN_PASSWORD = "09876";


/* =================================
   DEFAULT SETTINGS
================================= */

const defaults = {

    site:
    "Ebad Gaming",

    hero:
    "Play exciting games, beat your high scores, and become the ultimate gamer.",

    g1n:
    "Space Rocket",

    g1d:
    "Fly your rocket and beat your score.",

    g2n:
    "Speed Racer",

    g2d:
    "Avoid enemy cars and beat your best score.",

    g3n:
    "Zombie Attack",

    g3d:
    "Survive the zombie attack.",

    color:
    "#ff3030"

};


/* =================================
   READ SETTINGS
================================= */

function getSetting(key){

    const value =
        localStorage.getItem(
            "ebad_" + key
        );

    return value || defaults[key];

}


/* =================================
   LOGIN
================================= */

function login(){

    const entered =
        document.getElementById(
            "password"
        ).value;

    const message =
        document.getElementById(
            "loginMsg"
        );


    if(
        entered === ADMIN_PASSWORD
    ){

        document.getElementById(
            "loginBox"
        ).style.display =
            "none";


        document.getElementById(
            "panel"
        ).style.display =
            "block";


        message.textContent = "";

        loadSettings();

    }else{

        message.className =
            "message error";

        message.textContent =
            "❌ Wrong password";

    }

}


/* =================================
   ENTER KEY LOGIN
================================= */

document.getElementById(
    "password"
).addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            login();

        }

    }
);


/* =================================
   LOAD SETTINGS
================================= */

function loadSettings(){

    document.getElementById(
        "siteInput"
    ).value =
        getSetting("site");


    document.getElementById(
        "heroInput"
    ).value =
        getSetting("hero");


    document.getElementById(
        "g1nInput"
    ).value =
        getSetting("g1n");


    document.getElementById(
        "g1dInput"
    ).value =
        getSetting("g1d");


    document.getElementById(
        "g2nInput"
    ).value =
        getSetting("g2n");


    document.getElementById(
        "g2dInput"
    ).value =
        getSetting("g2d");


    document.getElementById(
        "g3nInput"
    ).value =
        getSetting("g3n");


    document.getElementById(
        "g3dInput"
    ).value =
        getSetting("g3d");


    document.getElementById(
        "colorInput"
    ).value =
        getSetting("color");

}


/* =================================
   SAVE
================================= */

function saveSettings(){

    localStorage.setItem(
        "ebad_site",
        document.getElementById(
            "siteInput"
        ).value.trim()
        ||
        defaults.site
    );


    localStorage.setItem(
        "ebad_hero",
        document.getElementById(
            "heroInput"
        ).value.trim()
        ||
        defaults.hero
    );


    localStorage.setItem(
        "ebad_g1n",
        document.getElementById(
            "g1nInput"
        ).value.trim()
        ||
        defaults.g1n
    );


    localStorage.setItem(
        "ebad_g1d",
        document.getElementById(
            "g1dInput"
        ).value.trim()
        ||
        defaults.g1d
    );


    localStorage.setItem(
        "ebad_g2n",
        document.getElementById(
            "g2nInput"
        ).value.trim()
        ||
        defaults.g2n
    );


    localStorage.setItem(
        "ebad_g2d",
        document.getElementById(
            "g2dInput"
        ).value.trim()
        ||
        defaults.g2d
    );


    localStorage.setItem(
        "ebad_g3n",
        document.getElementById(
            "g3nInput"
        ).value.trim()
        ||
        defaults.g3n
    );


    localStorage.setItem(
        "ebad_g3d",
        document.getElementById(
            "g3dInput"
        ).value.trim()
        ||
        defaults.g3d
    );


    localStorage.setItem(
        "ebad_color",
        document.getElementById(
            "colorInput"
        ).value
    );


    document.getElementById(
        "saveMsg"
    ).textContent =
        "✅ Changes saved successfully.";

}


/* =================================
   LOGOUT
================================= */

function logout(){

    document.getElementById(
        "panel"
    ).style.display =
        "none";


    document.getElementById(
        "loginBox"
    ).style.display =
        "block";


    document.getElementById(
        "password"
    ).value = "";


    document.getElementById(
        "loginMsg"
    ).textContent = "";

}

</script>

</body>
</html>
