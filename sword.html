<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sword Battle - Ebad Gaming</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#08060d;
  color:white;
  text-align:center;
}

header{
  padding:16px;
  background:#11101a;
  border-bottom:2px solid #b45cff;
}

header a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

h1{
  color:#d88aff;
  margin:20px 0 8px;
}

.info{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:15px;
}

.box{
  background:#17121f;
  border:1px solid #49355b;
  border-radius:10px;
  padding:10px 15px;
  font-weight:bold;
}

#game{
  position:relative;
  width:360px;
  height:540px;
  max-width:92vw;
  margin:20px auto;
  overflow:hidden;
  border:4px solid #fff;
  border-radius:15px;
  background:linear-gradient(#2d1b3d,#100c15);
}

.ground{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:130px;
  background:#201626;
}

.player,
.enemy{
  position:absolute;
  bottom:75px;
  width:70px;
  height:100px;
}

.player{
  left:35px;
}

.enemy{
  right:35px;
}

.body{
  position:absolute;
  left:18px;
  top:28px;
  width:35px;
  height:55px;
  border-radius:12px;
}

.player .body{
  background:#2689d8;
}

.enemy .body{
  background:#d8333d;
}

.head{
  position:absolute;
  left:24px;
  top:5px;
  width:23px;
  height:23px;
  border-radius:50%;
  background:#eec4a4;
}

.sword{
  position:absolute;
  width:8px;
  height:65px;
  top:14px;
  background:#eee;
  border-radius:5px;
}

.player .sword{
  right:0;
  transform:rotate(-35deg);
}

.enemy .sword{
  left:0;
  transform:rotate(35deg);
}

.health{
  width:240px;
  height:18px;
  margin:15px auto 10px;
  background:#222;
  border:2px solid #fff;
  border-radius:10px;
  overflow:hidden;
}

.health-bar{
  width:100%;
  height:100%;
  background:#35df65;
}

.message{
  min-height:28px;
  color:#ffd84d;
  font-weight:bold;
  margin:10px;
}

button{
  border:0;
  border-radius:10px;
  background:#b45cff;
  color:white;
  padding:12px 18px;
  margin:5px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.controls{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:10px;
}

.control{
  width:80px;
  height:55px;
  font-size:24px;
}

.help{
  color:#999;
}
</style>
</head>

<body>

<header>
<a href="games.html">← Back to Games</a>
</header>

<h1>⚔️ Sword Battle</h1>

<div class="info">
  <div class="box">🏆 Score: <span id="score">0</span></div>
  <div class="box">❤️ Lives: <span id="lives">3</span></div>
  <div class="box">⚡ Level: <span id="level">1</span></div>
</div>

<div class="health">
  <div class="health-bar" id="health"></div>
</div>

<div id="game">

  <div class="ground"></div>

  <div class="player" id="player">
    <div class="head"></div>
    <div class="body"></div>
    <div class="sword"></div>
  </div>

  <div class="enemy" id="enemy">
    <div class="head"></div>
    <div class="body"></div>
    <div class="sword"></div>
  </div>

</div>

<div class="message" id="message">
Press START BATTLE
</div>

<button onclick="startGame()">
START BATTLE
</button>

<button onclick="restartGame()">
RESTART
</button>

<div class="controls">

<button class="control" onclick="moveLeft()">
⬅️
</button>

<button class="control" onclick="attack()">
⚔️
</button>

<button class="control" onclick="moveRight()">
➡️
</button>

</div>

<p class="help">
Arrow keys: move<br>
SPACE: attack
</p>

<script>

let running=false;

let score=0;
let lives=3;
let level=1;

let enemyHealth=100;

let playerX=35;
let enemyX=35;

let enemyTimer=null;

const player=
document.getElementById("player");

const enemy=
document.getElementById("enemy");

const health=
document.getElementById("health");

function update(){

  player.style.left=playerX+"px";

  enemy.style.right=enemyX+"px";

  health.style.width=enemyHealth+"%";
}

function startGame(){

  if(running)return;

  running=true;

  score=0;
  lives=3;
  level=1;

  enemyHealth=100;

  playerX=35;
  enemyX=35;

  update();

  document.getElementById("score").textContent=0;
  document.getElementById("lives").textContent=3;
  document.getElementById("level").textContent=1;

  document.getElementById("message").textContent=
    "⚔️ Fight! Move closer and attack.";

  clearInterval(enemyTimer);

  enemyTimer=
    setInterval(enemyAttack,1200);
}

function moveLeft(){

  if(!running)return;

  playerX-=20;

  if(playerX<5){
    playerX=5;
  }

  update();
}

function moveRight(){

  if(!running)return;

  playerX+=20;

  if(playerX>250){
    playerX=250;
  }

  update();
}

function attack(){

  if(!running)return;

  const enemyPosition=
    250-enemyX;

  const distance=
    Math.abs(playerX-enemyPosition);

  if(distance>100){

    document.getElementById("message").textContent=
      "🗡️ Move closer to the enemy!";

    return;
  }

  enemyHealth-=25;

  if(enemyHealth<0){
    enemyHealth=0;
  }

  update();

  document.getElementById("message").textContent=
    "⚔️ HIT! Enemy health: "+
    enemyHealth+"%";

  if(enemyHealth<=0){

    score++;

    level=
      Math.floor(score/5)+1;

    enemyHealth=100;

    enemyX=
      35+Math.random()*90;

    document.getElementById("score").textContent=
      score;

    document.getElementById("level").textContent=
      level;

    document.getElementById("message").textContent=
      "🏆 Enemy defeated!";

    update();
  }
}

function enemyAttack(){

  if(!running)return;

  const enemyPosition=
    250-enemyX;

  const distance=
    Math.abs(playerX-enemyPosition);

  if(distance<110){

    lives--;

    document.getElementById("lives").textContent=
      lives;

    document.getElementById("message").textContent=
      "💥 Enemy attacked!";

    if(lives<=0){

      gameOver();
    }
  }
}

function gameOver(){

  running=false;

  clearInterval(enemyTimer);

  document.getElementById("message").textContent=
    "💀 GAME OVER! Score: "+score;
}

function restartGame(){

  running=false;

  clearInterval(enemyTimer);

  score=0;
  lives=3;
  level=1;

  enemyHealth=100;

  playerX=35;
  enemyX=35;

  document.getElementById("score").textContent=0;
  document.getElementById("lives").textContent=3;
  document.getElementById("level").textContent=1;

  document.getElementById("message").textContent=
    "Press START BATTLE";

  update();
}

document.addEventListener("keydown",function(e){

  if(
    e.target &&
    (
      e.target.tagName==="INPUT" ||
      e.target.tagName==="TEXTAREA"
    )
  ){
    return;
  }

  if(e.key==="ArrowLeft"){
    e.preventDefault();
    moveLeft();
  }

  if(e.key==="ArrowRight"){
    e.preventDefault();
    moveRight();
  }

  if(e.code==="Space"){
    e.preventDefault();
    attack();
  }

});

update();

</script>

</body>
</html>
