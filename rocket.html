<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Space Rocket - Ebad Gaming</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --accent:#ff4b5c;
    --blue:#6fdcff;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;
    text-align:center;

    background:
        radial-gradient(
            circle at top,
            #202450,
            #080913 55%,
            #03040a
        );

    overflow-x:hidden;
}


/* =========================
   HEADER
========================= */

header{
    background:
        rgba(5,6,15,.97);

    border-bottom:
        2px solid
        #7f72ff;

    padding:16px 20px;
}

header a{
    color:#fff;
    text-decoration:none;
    font-weight:800;
}


/* =========================
   PAGE
========================= */

.page{
    padding:
        16px
        12px
        45px;
}

h1{
    margin:
        8px
        0
        4px;

    font-size:
        clamp(
            30px,
            6vw,
            50px
        );
}

.subtitle{
    color:#a9a9b7;
    margin-bottom:15px;
}


/* =========================
   STATS
========================= */

.stats{
    display:flex;

    justify-content:center;

    align-items:center;

    gap:10px;

    flex-wrap:wrap;

    margin:
        15px
        0;
}

.stat{
    background:#111322;

    border:
        1px solid
        #353957;

    border-radius:10px;

    padding:
        9px
        14px;

    font-weight:800;
}

.best{
    color:#ffd84d;
    font-weight:800;
    margin-bottom:12px;
}


/* =========================
   GAME FRAME
========================= */

.game-frame{
    width:
        min(
            410px,
            95vw
        );

    margin:0 auto;

    padding:10px;

    background:
        linear-gradient(
            180deg,
            #171a2c,
            #0d0f1b
        );

    border:
        1px solid
        #383d63;

    border-radius:22px;

    box-shadow:
        0 20px 55px
        rgba(0,0,0,.4);
}


/* =========================
   GAME AREA
========================= */

.game-box{
    position:relative;

    width:100%;

    aspect-ratio:
        360 / 540;

    overflow:hidden;

    border:
        4px solid
        #e9ebff;

    border-radius:16px;

    background:
        linear-gradient(
            180deg,
            #070a1c,
            #101637 60%,
            #151a36 100%
        );

    touch-action:none;

    user-select:none;

    -webkit-user-select:none;
}


/* =========================
   STARS
========================= */

.star{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#fff;

    opacity:.8;

    pointer-events:none;
}


/* =========================
   PLANETS
========================= */

.planet{
    position:absolute;

    border-radius:50%;

    pointer-events:none;
}

.planet.one{
    width:54px;
    height:54px;

    top:55px;
    left:30px;

    background:
        radial-gradient(
            circle at 30% 30%,
            #ffb4d0,
            #bd4f89 48%,
            #5a224e
        );

    box-shadow:
        0 0 25px
        rgba(
            255,
            120,
            200,
            .16
        );
}

.planet.two{
    width:38px;
    height:38px;

    top:160px;
    right:24px;

    background:
        radial-gradient(
            circle at 30% 30%,
            #8fe9ff,
            #2a76c5 50%,
            #102f69
        );
}


/* =========================
   ROCKET
========================= */

.rocket{
    position:absolute;

    left:50%;
    bottom:30px;

    width:58px;
    height:90px;

    z-index:10;

    will-change:transform;

    transform:
        translate3d(-50%,0,0);
}

.rocket-body{
    position:absolute;

    left:13px;
    top:14px;

    width:32px;
    height:58px;

    border-radius:
        18px
        18px
        10px
        10px;

    background:
        linear-gradient(
            180deg,
            #f3f5ff,
            #aeb6d9
        );

    box-shadow:
        inset
        0 4px 0
        rgba(
            255,
            255,
            255,
            .4
        );
}

.rocket-window{
    position:absolute;

    left:19px;
    top:27px;

    width:20px;
    height:20px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #c8f7ff,
            #2471ad
        );

    border:
        2px solid
        #d9ffff;
}

.rocket-fin.left{
    position:absolute;

    left:5px;
    top:52px;

    width:16px;
    height:30px;

    background:#f04a58;

    clip-path:
        polygon(
            100% 0,
            0 100%,
            100% 100%
        );
}

.rocket-fin.right{
    position:absolute;

    right:5px;
    top:52px;

    width:16px;
    height:30px;

    background:#f04a58;

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );
}

.flame{
    position:absolute;

    left:20px;
    bottom:0;

    width:18px;
    height:32px;

    border-radius:
        0
        0
        12px
        12px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #ffe35a 30%,
            #ff6a00 70%,
            rgba(
                255,
                60,
                0,
                0
            )
        );

    filter:
        drop-shadow(
            0 0 8px
            rgba(
                255,
                150,
                0,
                .7
            )
        );

    animation:
        flamePulse
        .12s
        infinite
        alternate;
}

@keyframes flamePulse{

    from{
        transform:scaleY(.92);
    }

    to{
        transform:scaleY(1.08);
    }
}


/* =========================
   METEOR
========================= */

.meteor{
    position:absolute;

    width:28px;
    height:28px;

    border-radius:50%;

    z-index:6;

    background:
        radial-gradient(
            circle at 30% 30%,
            #ffd5b0,
            #bc6743 45%,
            #462017
        );

    box-shadow:
        0 0 10px
        rgba(
            255,
            125,
            50,
            .25
        );

    will-change:transform;
}


/* =========================
   BULLET
========================= */

.bullet{
    position:absolute;

    width:5px;
    height:20px;

    border-radius:5px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #78ecff
        );

    box-shadow:
        0 0 10px
        rgba(
            90,
            230,
            255,
            .9
        );

    z-index:9;

    will-change:transform;
}


/* =========================
   EXPLOSION
========================= */

.explosion{
    position:absolute;

    width:46px;
    height:46px;

    border-radius:50%;

    border:
        4px solid
        #ffd45a;

    pointer-events:none;

    z-index:20;

    animation:
        explode
        .28s
        ease-out
        forwards;
}

@keyframes explode{

    0%{
        opacity:1;
        transform:scale(.2);
    }

    100%{
        opacity:0;
        transform:scale(1.5);
    }
}


/* =========================
   MESSAGE
========================= */

.message{
    min-height:30px;

    margin:
        13px
        0
        7px;

    color:#ffd84d;

    font-weight:800;
}


/* =========================
   BUTTONS
========================= */

.actions{
    display:flex;

    justify-content:center;

    gap:8px;

    flex-wrap:wrap;
}

.btn{
    border:0;

    border-radius:10px;

    background:
        var(--accent);

    color:#fff;

    padding:
        13px
        20px;

    min-width:145px;

    font-size:16px;

    font-weight:900;

    cursor:pointer;
}

.btn.secondary{
    background:#292d42;

    border:
        1px solid
        #474d6a;
}


/* =========================
   HELP
========================= */

.help{
    color:#8f93a0;

    margin-top:10px;

    font-size:14px;

}


@media(max-width:450px){

    .btn{
        width:100%;

        max-width:180px;
    }

}

</style>

</head>


<body>


<header>

<a href="games.html">
← Back to Games
</a>

</header>


<div class="page">


<h1>
🚀 Space Rocket
</h1>


<p class="subtitle">
Swipe left or right — rocket fires automatically!
</p>


<div class="stats">


<div class="stat">
🏆 Score:
<span id="score">
0
</span>
</div>


<div class="stat">
❤️ Lives:
<span id="lives">
3
</span>
</div>


<div class="stat">
⚡ Level:
<span id="level">
1
</span>
</div>


<div class="stat">
🥇 Best:
<span id="best">
0
</span>
</div>


</div>


<div
class="best"
id="bestText"
>
🥇 Best Player: Nobody yet
</div>


<div class="game-frame">


<div
class="game-box"
id="gameBox"
>


<div class="planet one"></div>

<div class="planet two"></div>


<div
class="rocket"
id="rocket"
>

<div
class="rocket-body"
></div>

<div
class="rocket-window"
></div>

<div
class="rocket-fin left"
></div>

<div
class="rocket-fin right"
></div>

<div
class="flame"
></div>

</div>


</div>


<div
class="message"
id="message"
>
Press START GAME to begin!
</div>


<div class="actions">

<button
class="btn"
onclick="startGame()"
>
▶ START GAME
</button>


<button
class="btn secondary"
onclick="restartGame()"
>
↻ RESTART
</button>

</div>


<p class="help">
📱 Mobile: swipe left/right = move + fire
<br>
💻 PC: ← → move • SPACE fire
</p>


</div>


</div>


<script>

/* =========================
   ELEMENTS
========================= */

const gameBox =
document.getElementById(
    "gameBox"
);

const rocket =
document.getElementById(
    "rocket"
);


/* =========================
   GAME STATE
========================= */

let rocketX=180;

let targetX=180;

let score=0;

let lives=3;

let level=1;

let meteorSpeed=2;

let running=false;

let animationId=null;

let meteorTimer=null;

let lastTime=0;

let lastShot=0;


/* =========================
   ARRAYS
========================= */

let meteors=[];

let bullets=[];


/* =========================
   TOUCH
========================= */

let touchStartX=0;

let touchStartY=0;


/* =========================
   BEST SCORE
========================= */

let best=
Number(
    localStorage.getItem(
        "ebadRocketBest"
    )
)||0;

let bestPlayer=
localStorage.getItem(
    "ebadRocketBestPlayer"
)||"";


/* =========================
   LANES
========================= */

const lanes=[
    60,
    180,
    300
];


/* =========================
   STARS
========================= */

function createStars(){

    for(
        let i=0;
        i<75;
        i++
    ){

        const star=
            document.createElement(
                "div"
            );

        star.className=
            "star";

        star.style.left=
            (
                Math.random()*
                100
            )+"%";

        star.style.top=
            (
                Math.random()*
                100
            )+"%";

        star.style.opacity=
            .25+
            Math.random()*
            .75;

        gameBox.appendChild(
            star
        );

    }
}

createStars();


/* =========================
   BEST DISPLAY
========================= */

function updateBest(){

    document.getElementById(
        "best"
    ).textContent=
        best;


    document.getElementById(
        "bestText"
    ).textContent=
        best>0 &&
        bestPlayer
        ?
        "🥇 Best Player: "+
        bestPlayer+
        " — "+
        best
        :
        "🥇 Best Player: Nobody yet";

}

updateBest();


/* =========================
   STATS
========================= */

function updateStats(){

    document.getElementById(
        "score"
    ).textContent=
        score;

    document.getElementById(
        "lives"
    ).textContent=
        lives;

    document.getElementById(
        "level"
    ).textContent=
        level;

}


/* =========================
   ROCKET POSITION
========================= */

function updateRocket(){

    rocket.style.transform=
        "translate3d("+
        (
            targetX-
            180
        )+
        "px,0,0) translateX(-50%)";

}


/* =========================
   SMOOTH MOVEMENT
========================= */

function smoothRocket(){

    const difference=
        targetX-
        rocketX;

    rocketX +=
        difference*
        0.18;

    rocket.style.transform=
        "translate3d("+
        (
            rocketX-
            180
        )+
        "px,0,0) translateX(-50%)";

}


/* =========================
   START
========================= */

function startGame(){

    if(running){
        return;
    }


    score=0;

    lives=3;

    level=1;

    meteorSpeed=2;

    rocketX=180;

    targetX=180;

    meteors=[];

    bullets=[];


    removeObjects();


    updateStats();

    updateRocket();


    running=true;


    document.getElementById(
        "message"
    ).textContent=
        "🚀 Launch! Swipe and destroy meteors!";


    lastTime=
        performance.now();


    animationId=
        requestAnimationFrame(
            gameLoop
        );


    meteorTimer=
        setInterval(
            spawnMeteor,
            700
        );

}


/* =========================
   MOVE LEFT
========================= */

function moveLeft(){

    if(!running){
        return;
    }


    targetX-=
        55;


    if(
        targetX<45
    ){
        targetX=45;
    }


    fire();

}


/* =========================
   MOVE RIGHT
========================= */

function moveRight(){

    if(!running){
        return;
    }


    targetX+=
        55;


    if(
        targetX>315
    ){
        targetX=315;
    }


    fire();

}


/* =========================
   FIRE
========================= */

function fire(){

    if(!running){
        return;
    }


    const now=
        performance.now();


    if(
        now-lastShot<
        120
    ){

        return;
    }


    lastShot=
        now;


    const bullet=
        document.createElement(
            "div"
        );


    bullet.className=
        "bullet";


    bullet.style.left=
        (
            rocketX-2
        )+
        "px";


    bullet.style.top=
        "415px";


    gameBox.appendChild(
        bullet
    );


    bullets.push({

        element:bullet,

        x:rocketX,

        y:415

    });

}


/* =========================
   METEOR SPAWN
========================= */

function spawnMeteor(){

    if(!running){
        return;
    }


    const x=
        lanes[
            Math.floor(
                Math.random()*
                lanes.length
            )
        ];


    const meteor=
        document.createElement(
            "div"
        );


    meteor.className=
        "meteor";


    meteor.style.left=
        (
            x-14
        )+
        "px";


    meteor.style.top=
        "-35px";


    gameBox.appendChild(
        meteor
    );


    meteors.push({

        element:meteor,

        x:x,

        y:-35,

        speed:
            meteorSpeed+
            Math.random()*
            1.2

    });

}


/* =========================
   MAIN GAME LOOP
========================= */

function gameLoop(time){

    if(!running){
        return;
    }


    const delta=
        Math.min(
            (
                time-
                lastTime
            )/
            16.67,
            2
        );


    lastTime=
        time;


    smoothRocket();

    moveBullets(
        delta
    );

    moveMeteors(
        delta
    );

    checkHits();


    animationId=
        requestAnimationFrame(
            gameLoop
        );

}


/* =========================
   BULLETS
========================= */

function moveBullets(delta){

    for(
        let i=
            bullets.length-1;
        i>=0;
        i--
    ){

        const b=
            bullets[i];


        b.y-=
            10*
            delta;


        b.element.style.transform=
            "translate3d(0,"+
            b.y+
            "px,0)";


        if(
            b.y<
            -40
        ){

            removeBullet(i);

        }

    }

}


/* =========================
   METEORS
========================= */

function moveMeteors(delta){

    for(
        let i=
            meteors.length-1;
        i>=0;
        i--
    ){

        const m=
            meteors[i];


        m.y +=
            m.speed*
            delta;


        m.element.style.transform=
            "translate3d(0,"+
            m.y+
            "px,0)";


        if(
            m.y>
            430
        ){

            const distance=
                Math.abs(
                    m.x-
                    rocketX
                );


            if(
                distance<
                42
            ){

                removeMeteor(i);

                lives--;

                updateStats();


                document.getElementById(
                    "message"
                ).textContent=
                    "💥 Meteor hit!";


                if(
                    lives<=0
                ){

                    gameOver();

                    return;
                }

            }

        }


        if(
            m.y>
            570
        ){

            removeMeteor(i);

        }

    }

}


/* =========================
   COLLISION
========================= */

function checkHits(){

    for(
        let bi=
            bullets.length-1;
        bi>=0;
        bi--
    ){

        const b=
            bullets[bi];


        for(
            let mi=
                meteors.length-1;
            mi>=0;
            mi--
        ){

            const m=
                meteors[mi];


            const dx=
                b.x-
                m.x;


            const dy=
                b.y-
                (
                    m.y+
                    14
                );


            const distance=
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(
                distance<
                28
            ){

                createExplosion(
                    m.x,
                    m.y
                );


                removeBullet(
                    bi
                );


                removeMeteor(
                    mi
                );


                score++;


                updateLevel();

                updateStats();


                document.getElementById(
                    "message"
                ).textContent=
                    "💥 Meteor destroyed!";


                break;

            }

        }

    }

}


/* =========================
   LEVEL
========================= */

function updateLevel(){

    const newLevel=
        Math.floor(
            score/
            10
        )+
        1;


    if(
        newLevel !==
        level
    ){

        level=
            newLevel;


        meteorSpeed=
            2+
            (
                level-
                1
            )*
            .35;


        document.getElementById(
            "message"
        ).textContent=
            "⚡ LEVEL "+
            level+
            "!";

    }

}


/* =========================
   EXPLOSION
========================= */

function createExplosion(
    x,
    y
){

    const effect=
        document.createElement(
            "div"
        );


    effect.className=
        "explosion";


    effect.style.left=
        (
            x-
            23
        )+
        "px";


    effect.style.top=
        (
            y-
            23
        )+
        "px";


    gameBox.appendChild(
        effect
    );


    setTimeout(
        function(){

            effect.remove();

        },
        300
    );

}


/* =========================
   REMOVE BULLET
========================= */

function removeBullet(
    index
){

    if(
        !bullets[index]
    ){
        return;
    }


    bullets[index]
        .element
        .remove();


    bullets.splice(
        index,
        1
    );

}


/* =========================
   REMOVE METEOR
========================= */

function removeMeteor(
    index
){

    if(
        !meteors[index]
    ){
        return;
    }


    meteors[index]
        .element
        .remove();


    meteors.splice(
        index,
        1
    );

}


/* =========================
   CLEAR OBJECTS
========================= */

function removeObjects(){

    meteors.forEach(
        function(m){

            m.element.remove();

        }
    );


    bullets.forEach(
        function(b){

            b.element.remove();

        }
    );


    meteors=[];

    bullets=[];

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running=false;


    clearInterval(
        meteorTimer
    );


    if(
        animationId
    ){

        cancelAnimationFrame(
            animationId
        );

    }


    if(
        score>
        best
    ){

        best=
            score;


        bestPlayer=
            "Player";


        localStorage.setItem(
            "ebadRocketBest",
            best
        );


        localStorage.setItem(
            "ebadRocketBestPlayer",
            bestPlayer
        );


        updateBest();


        document.getElementById(
            "message"
        ).textContent=
            "🏆 NEW HIGH SCORE! "+
            score;

    }else{

        document.getElementById(
            "message"
        ).textContent=
            "💥 GAME OVER! Score: "+
            score;

    }

}


/* =========================
   RESTART
========================= */

function restartGame(){

    running=false;


    clearInterval(
        meteorTimer
    );


    if(
        animationId
    ){

        cancelAnimationFrame(
            animationId
        );

    }


    score=0;

    lives=3;

    level=1;

    meteorSpeed=2;

    rocketX=180;

    targetX=180;


    removeObjects();

    updateRocket();

    updateStats();


    document.getElementById(
        "message"
    ).textContent=
        "Press START GAME to begin!";

}


/* =========================
   MOBILE SWIPE
========================= */

gameBox.addEventListener(
    "touchstart",
    function(e){

        if(!running){
            return;
        }


        const touch=
            e.touches[0];


        touchStartX=
            touch.clientX;


        touchStartY=
            touch.clientY;

    },
    {
        passive:true
    }
);


gameBox.addEventListener(
    "touchend",
    function(e){

        if(!running){
            return;
        }


        const touch=
            e.changedTouches[0];


        const dx=
            touch.clientX-
            touchStartX;


        const dy=
            touch.clientY-
            touchStartY;


        /*
          IMPORTANT:
          Only a swipe fires.
          Simple tap does nothing.
        */

        if(
            Math.abs(dx)>30 &&
            Math.abs(dx)>
            Math.abs(dy)
        ){

            if(
                dx<0
            ){

                moveLeft();

            }else{

                moveRight();

            }

        }

    },
    {
        passive:true
    }
);


/* =========================
   PC CONTROLS
========================= */

document.addEventListener(
    "keydown",
    function(e){

        const typing=
            document.activeElement &&
            (
                document.activeElement.tagName===
                "INPUT" ||
                document.activeElement.tagName===
                "TEXTAREA"
            );


        if(
            typing
        ){
            return;
        }


        if(
            e.key===
            "ArrowLeft"
        ){

            e.preventDefault();

            moveLeft();

        }


        if(
            e.key===
            "ArrowRight"
        ){

            e.preventDefault();

            moveRight();

        }


        if(
            e.code===
            "Space"
        ){

            e.preventDefault();

            fire();

        }

    }
);


/* =========================
   INITIAL
========================= */

updateRocket();

updateStats();

</script>
