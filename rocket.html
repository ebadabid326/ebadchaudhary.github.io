<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Space Rocket - Ebad Gaming</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --accent:#4fb5ff;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    text-align:center;
    background:
        radial-gradient(circle at top,#101d36,#050812 58%,#020308);
}

header{
    background:rgba(5,8,16,.96);
    border-bottom:2px solid var(--accent);
    padding:16px 20px;
}

header a{
    color:#fff;
    text-decoration:none;
    font-weight:800;
}

.page{
    padding:18px 12px 45px;
}

h1{
    margin:8px 0 4px;
    font-size:clamp(30px,6vw,50px);
    color:#8bd0ff;
}

.subtitle{
    color:#9da8b7;
    margin-bottom:15px;
}

.player-name-box{
    width:min(380px,94vw);
    margin:0 auto 15px;
    padding:15px;
    background:#0d1420;
    border:1px solid #2d4862;
    border-radius:14px;
    text-align:left;
}

.player-name-box label{
    display:block;
    color:#aab5c2;
    font-size:14px;
    margin-bottom:7px;
}

.player-name-box input{
    width:100%;
    height:48px;
    padding:10px 14px;
    border-radius:9px;
    border:2px solid #36506a;
    background:#050a12;
    color:#fff;
    font-size:17px;
    outline:none;
}

.player-name-box input:focus{
    border-color:var(--accent);
}

.info{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:15px 0;
}

.info-box{
    background:#0d1420;
    border:1px solid #29425a;
    border-radius:10px;
    padding:9px 14px;
    font-weight:800;
}

.best-player{
    margin:8px 0 12px;
    color:#ffd84d;
    font-weight:800;
}

.game-frame{
    width:min(400px,95vw);
    margin:0 auto;
    padding:10px;
    background:linear-gradient(180deg,#101927,#090f18);
    border:1px solid #2f4154;
    border-radius:22px;
}

.game-box{
    position:relative;
    width:100%;
    aspect-ratio:360/540;
    overflow:hidden;
    border:4px solid #dff2ff;
    border-radius:16px;
    background:#02040a;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

.message{
    min-height:30px;
    margin:13px 0 7px;
    color:#ffd43b;
    font-weight:800;
}

.actions{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:10px;
    background:var(--accent);
    color:#06111b;
    padding:12px 18px;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
}

.btn:hover{
    filter:brightness(1.08);
}

.fire-btn{
    background:#ff5a63;
    color:#fff;
}

.reset-btn{
    background:#292d36;
    color:#fff;
    border:1px solid #48505e;
}

.help{
    color:#8e9bab;
    margin-top:10px;
    font-size:13px;
    line-height:1.5;
}
</style>
</head>

<body>

<header>
<a href="games.html">← Back to Games</a>
</header>

<div class="page">

<h1>🚀 Space Rocket</h1>

<p class="subtitle">
Move your rocket, destroy asteroids and survive.
</p>

<div class="player-name-box">

<label for="playerName">
👤 Player Name
</label>

<input
id="playerName"
type="text"
maxlength="30"
autocomplete="off"
spellcheck="false"
placeholder="Enter your name"
>

</div>

<div class="info">

<div class="info-box">
🏆 Score:
<span id="score">0</span>
</div>

<div class="info-box">
❤️ Lives:
<span id="lives">3</span>
</div>

<div class="info-box">
⚡ Level:
<span id="level">1</span>
</div>

<div class="info-box">
🥇 Best:
<span id="best">0</span>
</div>

</div>

<div class="best-player" id="bestPlayer">
🥇 Best Player: Nobody yet
</div>

<div class="game-frame">

<div class="game-box" id="gameBox">

<canvas
id="gameCanvas"
width="360"
height="540"
></canvas>

</div>

<div class="message" id="message">
Enter your name and press START.
</div>

<div class="actions">

<button
class="btn"
onclick="startGame()"
>
START GAME
</button>

<button
class="btn"
onclick="restartGame()"
>
RESTART
</button>

<button
class="btn fire-btn"
onclick="shoot()"
>
🔥 FIRE
</button>

<button
class="btn reset-btn"
onclick="resetBestScore()"
>
🗑️ RESET BEST
</button>

</div>

<p class="help">
📱 Mobile: swipe/drag = move, tap ya FIRE = shoot<br>
💻 Computer: ← → = move, SPACE = shoot
</p>

</div>

</div>

<script>

const canvas =
document.getElementById("gameCanvas");

const ctx =
canvas.getContext("2d");

const gameBox =
document.getElementById("gameBox");

const W = canvas.width;
const H = canvas.height;


/* =========================
   PLAYER
========================= */

const playerNameInput =
document.getElementById("playerName");

const savedName =
localStorage.getItem("ebadRocketPlayer");

if(savedName){
    playerNameInput.value = savedName;
}

playerNameInput.addEventListener(
    "input",
    function(){
        localStorage.setItem(
            "ebadRocketPlayer",
            this.value
        );
    }
);


/* =========================
   VARIABLES
========================= */

let running=false;
let animationId=null;
let lastTime=0;

let score=0;
let lives=3;
let level=1;

let playerX=W/2;
let playerY=475;

let rocketSpeed=90;
let asteroidSpeed=80;
let spawnInterval=850;
let spawnTimer=0;

let bullets=[];
let asteroids=[];

let best =
Number(
    localStorage.getItem(
        "ebadRocketBest"
    )
) || 0;

let bestPlayer =
localStorage.getItem(
    "ebadRocketBestPlayer"
) || "";

document.getElementById(
    "best"
).textContent=best;

updateBestPlayer();


/* =========================
   STARS
========================= */

const stars=[];

for(let i=0;i<90;i++){

    stars.push({
        x:Math.random()*W,
        y:Math.random()*H,
        r:Math.random()*1.6+0.4,
        s:10+Math.random()*30
    });

}


/* =========================
   INFO
========================= */

function updateStats(){

    document.getElementById(
        "score"
    ).textContent=score;

    document.getElementById(
        "lives"
    ).textContent=lives;

    document.getElementById(
        "level"
    ).textContent=level;

}

function updateBestPlayer(){

    document.getElementById(
        "bestPlayer"
    ).textContent =
        bestPlayer && best>0
        ? "🥇 Best Player: "+bestPlayer+" — "+best
        : "🥇 Best Player: Nobody yet";
}


/* =========================
   START
========================= */

function startGame(){

    if(running){
        return;
    }

    const name =
        playerNameInput.value.trim();

    if(!name){

        alert(
            "Please enter your name first."
        );

        playerNameInput.focus();

        return;
    }

    localStorage.setItem(
        "ebadRocketPlayer",
        name
    );

    running=true;

    score=0;
    lives=3;
    level=1;

    playerX=W/2;
    playerY=475;

    asteroidSpeed=80;
    spawnInterval=850;
    spawnTimer=0;

    bullets=[];
    asteroids=[];

    updateStats();

    document.getElementById(
        "message"
    ).textContent =
        "🚀 Good luck, "+name+"!";

    lastTime =
        performance.now();

    animationId =
        requestAnimationFrame(
            loop
        );
}


/* =========================
   RESTART
========================= */

function restartGame(){

    running=false;

    if(animationId){
        cancelAnimationFrame(
            animationId
        );

        animationId=null;
    }

    score=0;
    lives=3;
    level=1;

    playerX=W/2;
    playerY=475;

    asteroidSpeed=80;
    spawnInterval=850;
    spawnTimer=0;

    bullets=[];
    asteroids=[];

    updateStats();

    document.getElementById(
        "message"
    ).textContent =
        "Enter your name and press START.";

    draw(0);
}


/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground(dt){

    ctx.fillStyle="#02040a";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* stars */

    stars.forEach(
        s=>{

            s.y +=
                s.s*dt;

            if(
                s.y>H
            ){

                s.y=-5;
                s.x=Math.random()*W;
            }

            ctx.fillStyle =
                "rgba(220,240,255,.9)";

            ctx.beginPath();

            ctx.arc(
                s.x,
                s.y,
                s.r,
                0,
                Math.PI*2
            );

            ctx.fill();

        }
    );


    /* nebula */

    const glow=
        ctx.createRadialGradient(
            W/2,
            120,
            20,
            W/2,
            120,
            250
        );

    glow.addColorStop(
        0,
        "rgba(50,120,190,.16)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=glow;

    ctx.fillRect(
        0,
        0,
        W,
        300
    );

}


/* =========================
   ROCKET
========================= */

function drawRocket(){

    ctx.save();

    ctx.translate(
        playerX,
        playerY
    );


    /* flame */

    const flame =
        16+
        Math.random()*8;

    ctx.fillStyle =
        "#ffb300";

    ctx.beginPath();

    ctx.moveTo(
        -8,
        30
    );

    ctx.lineTo(
        0,
        30+flame
    );

    ctx.lineTo(
        8,
        30
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "#ff5a36";

    ctx.beginPath();

    ctx.moveTo(
        -4,
        30
    );

    ctx.lineTo(
        0,
        30+flame*.7
    );

    ctx.lineTo(
        4,
        30
    );

    ctx.closePath();

    ctx.fill();


    /* body */

    const body =
        ctx.createLinearGradient(
            -15,
            -30,
            15,
            30
        );

    body.addColorStop(
        0,
        "#ffffff"
    );

    body.addColorStop(
        .5,
        "#d9e2ea"
    );

    body.addColorStop(
        1,
        "#7f8c98"
    );

    ctx.fillStyle=body;

    ctx.beginPath();

    ctx.moveTo(
        0,
        -34
    );

    ctx.lineTo(
        -15,
        14
    );

    ctx.lineTo(
        -12,
        30
    );

    ctx.lineTo(
        12,
        30
    );

    ctx.lineTo(
        15,
        14
    );

    ctx.closePath();

    ctx.fill();


    /* window */

    ctx.fillStyle =
        "#45b9ff";

    ctx.beginPath();

    ctx.arc(
        0,
        -5,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle =
        "#d9f3ff";

    ctx.lineWidth=2;

    ctx.stroke();


    /* fins */

    ctx.fillStyle =
        "#ff3f4d";

    ctx.beginPath();

    ctx.moveTo(
        -12,
        15
    );

    ctx.lineTo(
        -27,
        31
    );

    ctx.lineTo(
        -9,
        28
    );

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        12,
        15
    );

    ctx.lineTo(
        27,
        31
    );

    ctx.lineTo(
        9,
        28
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();

}


/* =========================
   ASTEROID
========================= */

function drawAsteroid(a){

    ctx.save();

    ctx.translate(
        a.x,
        a.y
    );

    ctx.rotate(
        a.rotation
    );


    ctx.fillStyle =
        "#8e715f";

    ctx.beginPath();

    ctx.moveTo(
        -a.r,
        -a.r*.2
    );

    ctx.lineTo(
        -a.r*.6,
        -a.r
    );

    ctx.lineTo(
        a.r*.2,
        -a.r*.85
    );

    ctx.lineTo(
        a.r,
        -a.r*.25
    );

    ctx.lineTo(
        a.r*.7,
        a.r*.75
    );

    ctx.lineTo(
        -a.r*.2,
        a.r
    );

    ctx.lineTo(
        -a.r,
        a.r*.5
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "#5f4a3e";

    ctx.beginPath();

    ctx.arc(
        -a.r*.25,
        -a.r*.2,
        a.r*.2,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        a.r*.35,
        a.r*.3,
        a.r*.14,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}


/* =========================
   BULLET
========================= */

function drawBullet(b){

    ctx.save();

    ctx.fillStyle =
        "#ffe600";

    ctx.shadowColor =
        "#ffe600";

    ctx.shadowBlur =
        12;

    ctx.fillRect(
        b.x-3,
        b.y-12,
        6,
        24
    );

    ctx.restore();

}


/* =========================
   SPAWN ASTEROID
========================= */

function spawnAsteroid(){

    asteroids.push({

        x:
            20+
            Math.random()*
            320,

        y:-35,

        r:
            16+
            Math.random()*10,

        speed:
            asteroidSpeed*
            (
                .8+
                Math.random()*.5
            ),

        rotation:
            Math.random()*Math.PI,

        rotateSpeed:
            (-1+
            Math.random()*2)

    });

}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(!running){
        return;
    }

    bullets.push({

        x:playerX,

        y:playerY-38,

        speed:480
    });

    document.getElementById(
        "message"
    ).textContent =
        "🔥 FIRE!";

}


/* =========================
   MOVE
========================= */

function moveLeft(){

    if(!running){
        return;
    }

    playerX-=35;

    if(
        playerX<35
    ){
        playerX=35;
    }
}

function moveRight(){

    if(!running){
        return;
    }

    playerX+=35;

    if(
        playerX>325
    ){
        playerX=325;
    }
}


/* =========================
   LOOP
========================= */

function loop(time){

    if(!running){
        return;
    }

    const dt =
        Math.min(
            (time-lastTime)/1000,
            .05
        );

    lastTime=time;

    update(dt);

    draw(dt);

    animationId =
        requestAnimationFrame(
            loop
        );
}


/* =========================
   UPDATE
========================= */

function update(dt){

    /* spawn */

    spawnTimer +=
        dt*1000;

    if(
        spawnTimer>=spawnInterval
    ){

        spawnTimer=0;

        spawnAsteroid();
    }


    /* asteroids */

    for(
        let i=asteroids.length-1;
        i>=0;
        i--
    ){

        const a =
            asteroids[i];

        a.y +=
            a.speed*dt;

        a.rotation +=
            a.rotateSpeed*dt;


        /* rocket collision */

        if(
            Math.hypot(
                a.x-playerX,
                a.y-playerY
            ) <
            a.r+18
        ){

            asteroids.splice(
                i,
                1
            );

            lives--;

            updateStats();

            document.getElementById(
                "message"
            ).textContent =
                "💥 Asteroid hit!";

            if(
                lives<=0
            ){

                gameOver();

                return;
            }

            continue;
        }


        /* missed asteroid */

        if(
            a.y>H+50
        ){

            asteroids.splice(
                i,
                1
            );

            score++;

            updateLevel();

            updateStats();

            continue;
        }

    }


    /* bullets */

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b =
            bullets[i];

        b.y -=
            b.speed*dt;


        if(
            b.y<-30
        ){

            bullets.splice(
                i,
                1
            );

            continue;
        }


        /* bullet collision */

        for(
            let j=asteroids.length-1;
            j>=0;
            j--
        ){

            const a =
                asteroids[j];

            const dx =
                b.x-a.x;

            const dy =
                b.y-a.y;

            const distance =
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(
                distance <
                a.r+7
            ){

                bullets.splice(
                    i,
                    1
                );

                asteroids.splice(
                    j,
                    1
                );

                score++;

                updateLevel();

                updateStats();

                document.getElementById(
                    "message"
                ).textContent =
                    "💥 Asteroid destroyed!";

                break;
            }
        }
    }

}


/* =========================
   LEVEL
========================= */

function updateLevel(){

    const newLevel =
        Math.floor(
            score/10
        )+1;


    if(
        newLevel!==level
    ){

        level=
            newLevel;

        asteroidSpeed =
            80+
            (level-1)*16;

        spawnInterval =
            Math.max(
                330,
                850-
                (level-1)*65
            );


        document.getElementById(
            "message"
        ).textContent =
            "⚡ LEVEL "+
            level+
            "!";

    }

}


/* =========================
   DRAW
========================= */

function draw(dt){

    drawBackground(dt);

    asteroids.forEach(
        drawAsteroid
    );

    bullets.forEach(
        drawBullet
    );

    drawRocket();
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running=false;

    if(animationId){

        cancelAnimationFrame(
            animationId
        );

        animationId=null;
    }


    const name =
        playerNameInput.value.trim();


    if(
        score>best
    ){

        best=score;

        bestPlayer=name;


        localStorage.setItem(
            "ebadRocketBest",
            best
        );

        localStorage.setItem(
            "ebadRocketBestPlayer",
            bestPlayer
        );


        document.getElementById(
            "best"
        ).textContent=
            best;


        updateBestPlayer();


        document.getElementById(
            "message"
        ).textContent =
            "🏆 NEW HIGH SCORE, "+
            name+
            "! Score: "+
            score;

    }else{

        document.getElementById(
            "message"
        ).textContent =
            "💀 GAME OVER, "+
            name+
            "! Score: "+
            score;
    }
}


/* =========================
   RESET BEST
========================= */

function resetBestScore(){

    const ok =
        confirm(
            "Kya aap Rocket Best Score aur Best Player delete karna chahte hain?"
        );

    if(!ok){
        return;
    }


    localStorage.removeItem(
        "ebadRocketBest"
    );

    localStorage.removeItem(
        "ebadRocketBestPlayer"
    );

    best=0;
    bestPlayer="";


    document.getElementById(
        "best"
    ).textContent=0;

    updateBestPlayer();


    document.getElementById(
        "message"
    ).textContent=
        "✅ Best Score reset ho gaya!";
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event){

        const active =
            document.activeElement;

        if(
            active &&
            (
                active.tagName==="INPUT" ||
                active.tagName==="TEXTAREA"
            )
        ){
            return;
        }


        if(
            event.key==="ArrowLeft"
        ){

            event.preventDefault();

            moveLeft();
        }


        if(
            event.key==="ArrowRight"
        ){

            event.preventDefault();

            moveRight();
        }


        if(
            event.code==="Space"
        ){

            event.preventDefault();

            shoot();
        }

    }
);


/* =========================
   MOBILE TOUCH
========================= */

let touchStartX=0;
let lastTouchX=0;
let dragging=false;

gameBox.addEventListener(
    "touchstart",
    function(event){

        if(
            !running ||
            !event.touches.length
        ){
            return;
        }

        touchStartX=
            event.touches[0].clientX;

        lastTouchX=
            touchStartX;

        dragging=true;

        event.preventDefault();

    },
    {passive:false}
);


gameBox.addEventListener(
    "touchmove",
    function(event){

        if(
            !running ||
            !dragging ||
            !event.touches.length
        ){
            return;
        }

        const currentX =
            event.touches[0].clientX;

        const dx =
            currentX-lastTouchX;


        if(
            Math.abs(dx)>3
        ){

            if(
                dx<0
            ){

                moveLeft();

            }else{

                moveRight();
            }


            lastTouchX=
                currentX;
        }


        event.preventDefault();

    },
    {passive:false}
);


gameBox.addEventListener(
    "touchend",
    function(event){

        if(
            !running
        ){

            dragging=false;

            return;
        }


        const endX =
            event.changedTouches.length
            ? event.changedTouches[0].clientX
            : lastTouchX;


        const dx =
            endX-touchStartX;


        /* tap = fire */

        if(
            Math.abs(dx)<20
        ){

            shoot();
        }


        dragging=false;

        event.preventDefault();

    },
    {passive:false}
);


gameBox.addEventListener(
    "touchcancel",
    function(){

        dragging=false;

    }
);


/* =========================
   FIRST DRAW
========================= */

updateStats();

draw(0);

</script>

</body>
</html>
