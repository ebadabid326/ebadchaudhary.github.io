<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Space Rocket - Ebad Gaming
</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --accent:#ff4b5c;
    --space:#070816;
}

body{

    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    text-align:center;

    background:
        radial-gradient(
            circle at top,
            #202450,
            #080913 55%,
            #03040a
        );
}


/* HEADER */

header{

    background:
        rgba(
            5,
            6,
            15,
            .96
        );

    border-bottom:
        2px solid
        #7f72ff;

    padding:
        16px 20px;

}

header a{

    color:#fff;

    text-decoration:none;

    font-weight:800;

}


/* PAGE */

.page{

    padding:
        18px
        12px
        50px;

}

h1{

    margin:
        8px
        0
        4px;

    font-size:
        clamp(
            30px,
            6vw,
            50px
        );

}

.subtitle{

    color:#a9a9b7;

    margin-bottom:15px;

}


/* STATS */

.stats{

    display:flex;

    justify-content:center;

    gap:10px;

    flex-wrap:wrap;

    margin:
        15px
        0;

}

.stat{

    background:#111322;

    border:
        1px solid
        #353957;

    border-radius:10px;

    padding:
        9px
        14px;

    font-weight:800;

}

.best{

    color:#ffd84d;

    font-weight:800;

    margin-bottom:12px;

}


/* GAME FRAME */

.game-frame{

    width:
        min(
            410px,
            95vw
        );

    margin:
        0 auto;

    padding:10px;

    background:
        linear-gradient(
            180deg,
            #171a2c,
            #0d0f1b
        );

    border:
        1px solid
        #383d63;

    border-radius:22px;

}


/* GAME */

.game-box{

    position:relative;

    width:100%;

    aspect-ratio:
        360 / 540;

    overflow:hidden;

    border:
        4px solid
        #e9ebff;

    border-radius:16px;

    background:
        linear-gradient(
            180deg,
            #070a1c,
            #101637 60%,
            #151a36 100%
        );

    touch-action:none;

    user-select:none;

}


/* STARS */

.star{

    position:absolute;

    width:3px;

    height:3px;

    border-radius:50%;

    background:#fff;

    opacity:.8;

}


/* PLANETS */

.planet{

    position:absolute;

    border-radius:50%;

}

.planet.one{

    width:54px;

    height:54px;

    top:55px;

    left:30px;

    background:
        radial-gradient(
            circle at 30% 30%,
            #ffb4d0,
            #bd4f89 48%,
            #5a224e
        );

    box-shadow:
        0 0 25px
        rgba(
            255,
            120,
            200,
            .16
        );

}

.planet.two{

    width:38px;

    height:38px;

    top:160px;

    right:24px;

    background:
        radial-gradient(
            circle at 30% 30%,
            #8fe9ff,
            #2a76c5 50%,
            #102f69
        );

}


/* PLAYER ROCKET */

.rocket{

    position:absolute;

    left:50%;

    bottom:30px;

    width:58px;

    height:90px;

    transform:
        translateX(-50%);

    z-index:10;

}

.rocket-body{

    position:absolute;

    left:13px;

    top:14px;

    width:32px;

    height:58px;

    border-radius:
        18px
        18px
        10px
        10px;

    background:
        linear-gradient(
            180deg,
            #f3f5ff,
            #aeb6d9
        );

    box-shadow:
        inset
        0 4px 0
        rgba(
            255,
            255,
            255,
            .4
        );

}

.rocket-window{

    position:absolute;

    left:19px;

    top:27px;

    width:20px;

    height:20px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #c8f7ff,
            #2471ad
        );

    border:
        2px solid
        #d9ffff;

}

.rocket-fin.left{

    position:absolute;

    left:5px;

    top:52px;

    width:16px;

    height:30px;

    background:#f04a58;

    clip-path:
        polygon(
            100% 0,
            0 100%,
            100% 100%
        );

}

.rocket-fin.right{

    position:absolute;

    right:5px;

    top:52px;

    width:16px;

    height:30px;

    background:#f04a58;

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );

}

.flame{

    position:absolute;

    left:20px;

    bottom:0;

    width:18px;

    height:32px;

    border-radius:
        0
        0
        12px
        12px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #ffe35a 30%,
            #ff6a00 70%,
            rgba(
                255,
                60,
                0,
                0
            )
        );

    filter:
        drop-shadow(
            0 0 8px
            rgba(
                255,
                150,
                0,
                .7
            )
        );

}


/* METEOR */

.meteor{

    position:absolute;

    width:26px;

    height:26px;

    border-radius:50%;

    z-index:6;

    background:
        radial-gradient(
            circle at 30% 30%,
            #ffd5b0,
            #bc6743 45%,
            #462017
        );

    box-shadow:
        0 0 10px
        rgba(
            255,
            125,
            50,
            .25
        );

}


/* BULLET */

.bullet{

    position:absolute;

    width:5px;

    height:18px;

    border-radius:5px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #78ecff
        );

    box-shadow:
        0 0 10px
        rgba(
            90,
            230,
            255,
            .9
        );

    z-index:9;

}


/* EXPLOSION */

.explosion{

    position:absolute;

    width:45px;

    height:45px;

    border-radius:50%;

    border:
        4px solid
        #ffd45a;

    pointer-events:none;

    z-index:20;

    animation:
        explode
        .3s
        ease-out
        forwards;

}

@keyframes explode{

    0%{

        opacity:1;

        transform:
            scale(.2);

    }

    100%{

        opacity:0;

        transform:
            scale(1.5);

    }

}


/* MESSAGE */

.message{

    min-height:30px;

    margin:
        13px
        0
        7px;

    color:#ffd84d;

    font-weight:800;

}


/* BUTTONS */

.actions{

    display:flex;

    justify-content:center;

    gap:8px;

    flex-wrap:wrap;

}

.btn{

    border:0;

    border-radius:10px;

    background:
        var(--accent);

    color:#fff;

    padding:
        13px
        20px;

    min-width:145px;

    font-size:16px;

    font-weight:900;

    cursor:pointer;

}

.btn.secondary{

    background:#292d42;

    border:
        1px solid
        #474d6a;

}


/* MOBILE */

.help{

    color:#8f93a0;

    margin-top:10px;

    font-size:14px;

}


@media(max-width:450px){

    .btn{

        width:100%;

        max-width:180px;

    }

}

</style>

</head>


<body>


<header>

<a href="games.html">
← Back to Games
</a>

</header>


<div class="page">


<h1>
🚀 Space Rocket
</h1>


<p class="subtitle">
Swipe left/right to move • Tap to fire
</p>


<div class="stats">


<div class="stat">
🏆 Score:
<span id="score">
0
</span>
</div>


<div class="stat">
❤️ Lives:
<span id="lives">
3
</span>
</div>


<div class="stat">
⚡ Level:
<span id="level">
1
</span>
</div>


<div class="stat">
🥇 Best:
<span id="best">
0
</span>
</div>


</div>


<div
class="best"
id="bestText"
>
🥇 Best Player: Nobody yet
</div>


<div class="game-frame">


<div
class="game-box"
id="gameBox"
>


<div
class="planet one"
>
</div>


<div
class="planet two"
>
</div>


<!-- ROCKET -->

<div
class="rocket"
id="rocket"
>

<div
class="rocket-body"
>
</div>


<div
class="rocket-window"
>
</div>


<div
class="rocket-fin left"
>
</div>


<div
class="rocket-fin right"
>
</div>


<div
class="flame"
>
</div>

</div>


</div>


<div
class="message"
id="message"
>
Press START GAME to begin!
</div>


<div class="actions">

<button
class="btn"
onclick="startGame()"
>
▶ START GAME
</button>


<button
class="btn secondary"
onclick="restartGame()"
>
↻ RESTART
</button>

</div>


<p class="help">
Mobile: swipe left/right • tap to fire
<br>
PC: ← → move • SPACE fire
</p>


</div>


</div>


<script>


/* =========================
   GAME
========================= */

const gameBox =
document.getElementById(
    "gameBox"
);


const rocket =
document.getElementById(
    "rocket"
);


let rocketX=180;


let score=0;

let lives=3;

let level=1;


let speed=1.8;


let running=false;


let timer=null;

let spawnTimer=null;


let meteors=[];

let bullets=[];


let lastShot=0;


let best=
Number(
    localStorage.getItem(
        "ebadRocketBest"
    )
)||0;


let bestPlayer=
localStorage.getItem(
    "ebadRocketBestPlayer"
)||"";


let touchStartX=0;

let touchStartY=0;


const lanes=[
60,
180,
300
];


/* =========================
   STARS
========================= */

function createStars(){

    for(
        let i=0;
        i<70;
        i++
    ){

        const star=
            document.createElement(
                "div"
            );


        star.className=
            "star";


        star.style.left=
            Math.random()*100+
            "%";


        star.style.top=
            Math.random()*100+
            "%";


        star.style.opacity=
            (
                .25+
                Math.random()*.75
            );


        gameBox.appendChild(
            star
        );

    }

}


createStars();


/* =========================
   BEST
========================= */

function updateBest(){

    document.getElementById(
        "best"
    ).textContent=
        best;


    document.getElementById(
        "bestText"
    ).textContent=
        best>0 &&
        bestPlayer
        ?
        "🥇 Best Player: "+
        bestPlayer+
        " — "+
        best
        :
        "🥇 Best Player: Nobody yet";

}


updateBest();


/* =========================
   STATS
========================= */

function updateStats(){

    document.getElementById(
        "score"
    ).textContent=
        score;


    document.getElementById(
        "lives"
    ).textContent=
        lives;


    document.getElementById(
        "level"
    ).textContent=
        level;

}


/* =========================
   START
========================= */

function startGame(){

    if(running){
        return;
    }


    score=0;

    lives=3;

    level=1;

    speed=1.8;

    rocketX=180;


    meteors=[];

    bullets=[];


    removeObjects();


    running=true;


    updateStats();


    updateRocket();


    document.getElementById(
        "message"
    ).textContent=
        "🚀 Launch! Survive the meteors!";


    timer=
        setInterval(
            gameLoop,
            30
        );


    spawnTimer=
        setInterval(
            spawnMeteor,
            750
        );

}


/* =========================
   ROCKET MOVE
========================= */

function updateRocket(){

    rocket.style.left=
        (
            rocketX-29
        )+
        "px";

}


function moveLeft(){

    if(!running){
        return;
    }


    rocketX-=35;


    if(
        rocketX<45
    ){

        rocketX=45;

    }


    updateRocket();

}


function moveRight(){

    if(!running){
        return;
    }


    rocketX+=35;


    if(
        rocketX>315
    ){

        rocketX=315;

    }


    updateRocket();

}


/* =========================
   FIRE
========================= */

function fire(){

    if(!running){
        return;
    }


    const now=
        Date.now();


    if(
        now-lastShot<180
    ){

        return;

    }


    lastShot=now;


    const bullet=
        document.createElement(
            "div"
        );


    bullet.className=
        "bullet";


    bullet.style.left=
        (
            rocketX-2
        )+
        "px";


    bullet.style.top=
        "410px";


    gameBox.appendChild(
        bullet
    );


    bullets.push({

        element:bullet,

        x:rocketX,

        y:410

    });

}


/* =========================
   SPAWN METEOR
========================= */

function spawnMeteor(){

    if(!running){
        return;
    }


    const x=
        lanes[
            Math.floor(
                Math.random()*
                lanes.length
            )
        ];


    const meteor=
        document.createElement(
            "div"
        );


    meteor.className=
        "meteor";


    meteor.style.left=
        (
            x-13
        )+
        "px";


    meteor.style.top=
        "-35px";


    gameBox.appendChild(
        meteor
    );


    meteors.push({

        element:meteor,

        x:x,

        y:-35,

        speed:
            speed+
            Math.random()*1.5

    });

}


/* =========================
   LOOP
========================= */

function gameLoop(){

    if(!running){
        return;
    }


    moveBullets();

    moveMeteors();

    checkHits();

}


/* =========================
   BULLETS
========================= */

function moveBullets(){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b=
            bullets[i];


        b.y-=14;


        b.element.style.top=
            b.y+"px";


        if(
            b.y<-30
        ){

            removeBullet(i);

        }

    }

}


/* =========================
   METEORS
========================= */

function moveMeteors(){

    for(
        let i=meteors.length-1;
        i>=0;
        i--
    ){

        const m=
            meteors[i];


        m.y+=m.speed;


        m.element.style.top=
            m.y+"px";


        if(
            m.y>445
        ){

            const distance=
                Math.abs(
                    m.x-
                    rocketX
                );


            if(
                distance<42
            ){

                removeMeteor(i);


                lives--;


                updateStats();


                document.getElementById(
                    "message"
                ).textContent=
                    "💥 METEOR HIT!";


                if(
                    lives<=0
                ){

                    gameOver();

                    return;

                }

            }

        }


        if(
            m.y>570
        ){

            removeMeteor(i);

        }

    }

}


/* =========================
   HIT DETECTION
========================= */

function checkHits(){

    for(
        let bi=bullets.length-1;
        bi>=0;
        bi--
    ){

        const b=
            bullets[bi];


        for(
            let mi=meteors.length-1;
            mi>=0;
            mi--
        ){

            const m=
                meteors[mi];


            const dx=
                b.x-
                m.x;


            const dy=
                b.y-
                (
                    m.y+
                    12
                );


            const dist=
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(
                dist<28
            ){

                createExplosion(
                    m.x,
                    m.y
                );


                removeBullet(
                    bi
                );


                removeMeteor(
                    mi
                );


                score++;


                updateLevel();


                updateStats();


                document.getElementById(
                    "message"
                ).textContent=
                    "💥 Meteor destroyed!";


                break;

            }

        }

    }

}


/* =========================
   LEVEL
========================= */

function updateLevel(){

    const newLevel=
        Math.floor(
            score/10
        )+1;


    if(
        newLevel!==level
    ){

        level=
            newLevel;


        speed=
            1.8+
            (
                level-1
            )*.35;


        document.getElementById(
            "message"
        ).textContent=
            "⚡ LEVEL "+
            level+
            "!";

    }

}


/* =========================
   EXPLOSION
========================= */

function createExplosion(
    x,
    y
){

    const effect=
        document.createElement(
            "div"
        );


    effect.className=
        "explosion";


    effect.style.left=
        (
            x-22
        )+
        "px";


    effect.style.top=
        (
            y-22
        )+
        "px";


    gameBox.appendChild(
        effect
    );


    setTimeout(
        function(){

            effect.remove();

        },
        320
    );

}


/* =========================
   REMOVE
========================= */

function removeBullet(
    index
){

    if(
        !bullets[index]
    ){

        return;

    }


    bullets[index]
        .element
        .remove();


    bullets.splice(
        index,
        1
    );

}


function removeMeteor(
    index
){

    if(
        !meteors[index]
    ){

        return;

    }


    meteors[index]
        .element
        .remove();


    meteors.splice(
        index,
        1
    );

}


function removeObjects(){

    meteors.forEach(
        m=>
            m.element.remove()
    );


    bullets.forEach(
        b=>
            b.element.remove()
    );


    meteors=[];

    bullets=[];

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running=false;


    clearTimers();


    if(
        score>best
    ){

        best=
            score;


        bestPlayer=
            "Player";


        localStorage.setItem(
            "ebadRocketBest",
            best
        );


        localStorage.setItem(
            "ebadRocketBestPlayer",
            bestPlayer
        );


        updateBest();


        document.getElementById(
            "message"
        ).textContent=
            "🏆 NEW HIGH SCORE! "+
            score;

    }else{

        document.getElementById(
            "message"
        ).textContent=
            "💥 GAME OVER! Score: "+
            score;

    }

}


/* =========================
   RESTART
========================= */

function restartGame(){

    running=false;


    clearTimers();


    score=0;

    lives=3;

    level=1;

    speed=1.8;

    rocketX=180;


    removeObjects();


    updateRocket();

    updateStats();


    document.getElementById(
        "message"
    ).textContent=
        "Press START GAME to begin!";

}


/* =========================
   TIMERS
========================= */

function clearTimers(){

    clearInterval(
        timer
    );

    clearInterval(
        spawnTimer
    );

}


/* =========================
   MOBILE SWIPE
========================= */

gameBox.addEventListener(
    "touchstart",
    function(e){

        if(!running){
            return;
        }


        const touch=
            e.touches[0];


        touchStartX=
            touch.clientX;


        touchStartY=
            touch.clientY;

    },
    {
        passive:true
    }
);


gameBox.addEventListener(
    "touchend",
    function(e){

        if(!running){
            return;
        }


        const touch=
            e.changedTouches[0];


        const dx=
            touch.clientX-
            touchStartX;


        const dy=
            touch.clientY-
            touchStartY;


        /* SWIPE */

        if(
            Math.abs(dx)>35 &&
            Math.abs(dx)>Math.abs(dy)
        ){

            if(
                dx<0
            ){

                moveLeft();

            }else{

                moveRight();

            }


            return;

        }


        /* TAP */

        if(
            Math.abs(dx)<20 &&
            Math.abs(dy)<20
        ){

            fire();

        }

    },
    {
        passive:true
    }
);


/* =========================
   PC CONTROLS
========================= */

document.addEventListener(
    "keydown",
    function(e){

        const typing=
            document.activeElement &&
            (
                document.activeElement.tagName===
                "INPUT" ||

                document.activeElement.tagName===
                "TEXTAREA"
            );


        if(
            typing
        ){

            return;

        }


        if(
            e.key===
            "ArrowLeft"
        ){

            e.preventDefault();

            moveLeft();

        }


        if(
            e.key===
            "ArrowRight"
        ){

            e.preventDefault();

            moveRight();

        }


        if(
            e.code===
            "Space"
        ){

            e.preventDefault();

            fire();

        }

    }
);


/* INITIAL */

updateRocket();

updateStats();

updateBest();

</script>

</body>
</html>
