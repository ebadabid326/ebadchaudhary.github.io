<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Racer - Ebad Gaming</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --accent:#ff3030;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    text-align:center;
    background:radial-gradient(circle at top,#1d1e2c,#08080f 55%,#050508);
}

header{
    background:rgba(9,9,15,.96);
    border-bottom:2px solid var(--accent);
    padding:16px 20px;
}

header a{
    color:#fff;
    text-decoration:none;
    font-weight:800;
}

.page{
    padding:18px 12px 50px;
}

h1{
    margin:8px 0 4px;
    font-size:clamp(30px,6vw,50px);
}

.subtitle{
    color:#a5a5b4;
    margin-bottom:15px;
}

/* NAME */
.player-name-box{
    width:min(380px,94vw);
    margin:0 auto 15px;
    padding:15px;
    background:#11131b;
    border:1px solid #303343;
    border-radius:14px;
    text-align:left;
}

.player-name-box label{
    display:block;
    color:#aaa;
    font-size:14px;
    margin-bottom:7px;
}

.player-name-box input{
    display:block;
    width:100%;
    height:50px;
    padding:10px 14px;
    border-radius:9px;
    border:2px solid #3a3d4d;
    background:#08090f;
    color:#fff;
    font-size:18px;
    font-family:Arial,sans-serif;
    outline:none;
}

.player-name-box input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(255,48,48,.12);
}

/* INFO */
.info{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:15px 0;
}

.info-box{
    background:#12131b;
    border:1px solid #303343;
    border-radius:10px;
    padding:9px 14px;
    font-weight:800;
}

.best-player{
    margin:8px 0 12px;
    color:#ffd84d;
    font-weight:800;
}

/* GAME */
.game-frame{
    width:min(400px,95vw);
    margin:0 auto;
    padding:10px;
    background:linear-gradient(180deg,#1c1e27,#0e0f15);
    border:1px solid #373948;
    border-radius:22px;
}

.game-box{
    position:relative;
    width:100%;
    aspect-ratio:320/520;
    overflow:hidden;
    border:4px solid #f1f1f1;
    border-radius:16px;
    background:#5b814c;
}

.grass{
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
        0deg,
        #4f7742 0 24px,
        #5b8249 24px 48px
    );
}

.side{
    position:absolute;
    top:0;
    bottom:0;
    width:28px;
    z-index:2;
    background:repeating-linear-gradient(
        180deg,
        #f4f4f4 0 14px,
        #d6222f 14px 28px
    );
}

.side.left{left:28px}
.side.right{right:28px}

.road{
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    width:250px;
    transform:translateX(-50%);
    z-index:1;
    background:linear-gradient(
        90deg,
        #202227 0%,
        #34373d 50%,
        #202227 100%
    );
}

.shoulder{
    position:absolute;
    top:0;
    bottom:0;
    width:5px;
    background:#ededed;
    z-index:2;
}

.shoulder.left{
    left:calc(50% - 127px);
}

.shoulder.right{
    left:calc(50% + 122px);
}

.lane{
    position:absolute;
    top:-90px;
    width:7px;
    height:75px;
    border-radius:4px;
    background:#fff;
    z-index:3;
}

.lane.one{
    left:calc(50% - 76px);
}

.lane.two{
    left:calc(50% + 69px);
}

/* CARS */
.car{
    position:absolute;
    width:60px;
    height:94px;
    z-index:8;
    filter:drop-shadow(0 8px 7px rgba(0,0,0,.5));
}

.player{
    left:calc(50% - 30px);
    bottom:15px;
}

.enemy{
    top:-120px;
}

.body-car{
    position:absolute;
    left:7px;
    right:7px;
    top:7px;
    bottom:7px;
    border-radius:17px 17px 12px 12px;
    box-shadow:
        inset 0 3px 0 rgba(255,255,255,.3),
        inset 0 -5px 0 rgba(0,0,0,.3);
}

.player .body-car{
    background:linear-gradient(180deg,#ff5252,#d61818 48%,#901010);
}

.enemy.yellow .body-car{
    background:linear-gradient(180deg,#ffe34d,#c69400);
}

.enemy.blue .body-car{
    background:linear-gradient(180deg,#4cbcff,#1a5e9c);
}

.enemy.white .body-car{
    background:linear-gradient(180deg,#f4f4f4,#929292);
}

.roof{
    position:absolute;
    left:14px;
    right:14px;
    top:19px;
    height:30px;
    border-radius:11px;
    background:#17191e;
}

.glass{
    position:absolute;
    left:18px;
    right:18px;
    top:23px;
    height:18px;
    border-radius:6px;
    background:linear-gradient(180deg,#bfe7ff,#4b7596);
}

.wheel{
    position:absolute;
    width:10px;
    height:23px;
    background:#111;
    border-radius:6px;
}

.wheel.left{left:0;top:22px}
.wheel.right{right:0;top:22px}
.wheel.left.back{left:0;top:auto;bottom:10px}
.wheel.right.back{right:0;top:auto;bottom:10px}

.light{
    position:absolute;
    width:9px;
    height:5px;
    border-radius:3px;
    top:11px;
}

.light.left{left:13px}
.light.right{right:13px}

.player .light{
    background:#fff1a8;
    box-shadow:0 0 8px rgba(255,240,150,.7);
}

.enemy .light{
    background:#ff3434;
}

/* BUTTONS */
.message{
    min-height:30px;
    margin:13px 0 7px;
    color:#ffd43b;
    font-weight:800;
}

.actions{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    padding:12px 20px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.btn:hover{
    filter:brightness(1.08);
}

.mobile{
    display:flex;
    justify-content:center;
    gap:22px;
    margin-top:12px;
}

.control{
    width:88px;
    height:56px;
    border:1px solid #3c4050;
    border-radius:12px;
    background:#1b1d26;
    color:#fff;
    font-size:25px;
    font-weight:800;
    cursor:pointer;
}

.control:active{
    transform:scale(.97);
}

.help{
    color:#8f93a0;
    margin-top:10px;
    font-size:14px;
}

@media(max-width:500px){
    .side.left{left:20px}
    .side.right{right:20px}
    .road{width:245px}
}
</style>
</head>

<body>

<header>
<a href="games.html">← Back to Games</a>
</header>

<div class="page">

<h1>🏎️ Speed Racer</h1>

<p class="subtitle">
Avoid traffic and beat your best score.
</p>

<!-- NAME -->
<div class="player-name-box">

<label for="playerName">
👤 Player Name
</label>

<input
id="playerName"
name="playerName"
type="text"
maxlength="30"
placeholder="Enter your name"
autocomplete="off"
spellcheck="false"
>

</div>

<div class="info">

<div class="info-box">
🏆 Score:
<span id="score">0</span>
</div>

<div class="info-box">
❤️ Lives:
<span id="lives">3</span>
</div>

<div class="info-box">
⚡ Level:
<span id="level">1</span>
</div>

<div class="info-box">
🥇 Best:
<span id="best">0</span>
</div>

</div>

<div
class="best-player"
id="bestPlayer"
>
🥇 Best Player: Nobody yet
</div>

<!-- GAME -->
<div class="game-frame">

<div class="game-box">

<div class="grass"></div>

<div class="side left"></div>
<div class="side right"></div>

<div class="road"></div>

<div class="shoulder left"></div>
<div class="shoulder right"></div>

<div class="lane one" id="lane1"></div>
<div class="lane two" id="lane2"></div>

<!-- PLAYER -->
<div class="car player" id="player">

<div class="body-car"></div>
<div class="roof"></div>
<div class="glass"></div>

<div class="wheel left"></div>
<div class="wheel right"></div>

<div class="wheel left back"></div>
<div class="wheel right back"></div>

<div class="light left"></div>
<div class="light right"></div>

</div>

<!-- ENEMY 1 -->
<div class="car enemy yellow" id="enemy1">

<div class="body-car"></div>
<div class="roof"></div>
<div class="glass"></div>

<div class="wheel left"></div>
<div class="wheel right"></div>

<div class="wheel left back"></div>
<div class="wheel right back"></div>

<div class="light left"></div>
<div class="light right"></div>

</div>

<!-- ENEMY 2 -->
<div class="car enemy blue" id="enemy2">

<div class="body-car"></div>
<div class="roof"></div>
<div class="glass"></div>

<div class="wheel left"></div>
<div class="wheel right"></div>

<div class="wheel left back"></div>
<div class="wheel right back"></div>

<div class="light left"></div>
<div class="light right"></div>

</div>

<!-- ENEMY 3 -->
<div class="car enemy white" id="enemy3">

<div class="body-car"></div>
<div class="roof"></div>
<div class="glass"></div>

<div class="wheel left"></div>
<div class="wheel right"></div>

<div class="wheel left back"></div>
<div class="wheel right back"></div>

<div class="light left"></div>
<div class="light right"></div>

</div>

</div>

<div
class="message"
id="message"
>
Enter your name and press START.
</div>

<div class="actions">

<button
class="btn"
onclick="startGame()"
>
START GAME
</button>

<button
class="btn"
onclick="restartGame()"
>
RESTART
</button>

</div>

<!-- ONLY BUTTON CONTROLS -->
<div class="mobile">

<button
class="control"
onclick="moveLeft()"
>
⬅️
</button>

<button
class="control"
onclick="moveRight()"
>
➡️
</button>

</div>

<p class="help">
Mobile: use the buttons to move the car.
</p>

</div>
</div>

<script>

/* =========================
   NAME
========================= */

const playerNameInput =
document.getElementById("playerName");

const oldName =
localStorage.getItem("ebadPlayerName");

if(oldName){
    playerNameInput.value = oldName;
}

playerNameInput.addEventListener(
    "input",
    function(){
        localStorage.setItem(
            "ebadPlayerName",
            this.value
        );
    }
);


/* =========================
   GAME VARIABLES
========================= */

let playerX = 132;

let score = 0;
let lives = 3;
let level = 1;

let speed = 3.5;

let running = false;
let timer = null;

let best =
Number(
    localStorage.getItem("ebadBestScore")
) || 0;

let bestPlayer =
localStorage.getItem("ebadBestPlayer") || "";

document.getElementById("best").textContent = best;

showBestPlayer();


const player =
document.getElementById("player");

const enemies = [
    document.getElementById("enemy1"),
    document.getElementById("enemy2"),
    document.getElementById("enemy3")
];

const laneMarks = [
    document.getElementById("lane1"),
    document.getElementById("lane2")
];

const lanes = [
    42,
    132,
    222
];


/* =========================
   BEST PLAYER
========================= */

function showBestPlayer(){

    if(bestPlayer && best > 0){

        document.getElementById(
            "bestPlayer"
        ).textContent =
            "🥇 Best Player: " +
            bestPlayer +
            " — " +
            best;

    }else{

        document.getElementById(
            "bestPlayer"
        ).textContent =
            "🥇 Best Player: Nobody yet";
    }
}


/* =========================
   RESET CARS
========================= */

function resetEnemies(){

    enemies[0].style.left = "42px";
    enemies[0].style.top = "-120px";

    enemies[1].style.left = "132px";
    enemies[1].style.top = "-360px";

    enemies[2].style.left = "222px";
    enemies[2].style.top = "-600px";
}

resetEnemies();


/* =========================
   START GAME
========================= */

function startGame(){

    if(running){
        return;
    }

    const name =
        playerNameInput.value.trim();

    if(!name){

        alert(
            "Please enter your name first."
        );

        playerNameInput.focus();

        return;
    }

    localStorage.setItem(
        "ebadPlayerName",
        name
    );

    running = true;

    score = 0;
    lives = 3;
    level = 1;

    speed = 3.5;

    playerX = 132;

    document.getElementById(
        "score"
    ).textContent = 0;

    document.getElementById(
        "lives"
    ).textContent = 3;

    document.getElementById(
        "level"
    ).textContent = 1;

    player.style.left =
        "132px";

    resetEnemies();

    document.getElementById(
        "message"
    ).textContent =
        "🔥 Good luck, " +
        name +
        "!";

    timer =
        setInterval(
            updateGame,
            30
        );
}


/* =========================
   UPDATE
========================= */

function updateGame(){

    /* Lane lines */

    laneMarks.forEach(
        lane => {

            let y =
                parseFloat(
                    lane.style.top
                );

            if(isNaN(y)){
                y = -90;
            }

            y += speed * 1.8;

            if(y > 550){
                y = -100;
            }

            lane.style.top =
                y + "px";
        }
    );


    /* Enemy cars */

    enemies.forEach(
        car => {

            let y =
                parseFloat(
                    car.style.top
                );

            if(isNaN(y)){
                y = -120;
            }

            y += speed;

            car.style.top =
                y + "px";


            /* Car passed */

            if(y > 550){

                score++;

                document.getElementById(
                    "score"
                ).textContent =
                    score;

                resetEnemy(car);

                updateLevel();
            }


            /* Collision */

            if(
                checkCollision(car)
            ){

                resetEnemy(car);

                lives--;

                document.getElementById(
                    "lives"
                ).textContent =
                    lives;


                if(lives <= 0){

                    gameOver();

                }else{

                    document.getElementById(
                        "message"
                    ).textContent =
                        "💥 CRASH! Lives left: " +
                        lives;
                }
            }
        }
    );
}


/* =========================
   RESET ONE ENEMY
========================= */

function resetEnemy(car){

    const lane =
        lanes[
            Math.floor(
                Math.random() *
                lanes.length
            )
        ];

    car.style.left =
        lane + "px";

    car.style.top =
        (
            -160 -
            Math.random() * 380
        ) + "px";
}


/* =========================
   COLLISION
========================= */

function checkCollision(car){

    const p =
        player.getBoundingClientRect();

    const e =
        car.getBoundingClientRect();

    return (
        p.left < e.right - 10 &&
        p.right > e.left + 10 &&
        p.top < e.bottom - 10 &&
        p.bottom > e.top + 10
    );
}


/* =========================
   LEVEL
========================= */

function updateLevel(){

    level =
        Math.floor(
            score / 10
        ) + 1;

    speed =
        3.5 +
        (level - 1) * 0.7;

    document.getElementById(
        "level"
    ).textContent =
        level;

    if(
        score > 0 &&
        score % 10 === 0
    ){

        document.getElementById(
            "message"
        ).textContent =
            "⚡ LEVEL " +
            level +
            "! Traffic is faster!";
    }
}


/* =========================
   MOVE LEFT
========================= */

function moveLeft(){

    if(!running){
        return;
    }

    playerX -= 45;

    if(playerX < 42){
        playerX = 42;
    }

    player.style.left =
        playerX + "px";
}


/* =========================
   MOVE RIGHT
========================= */

function moveRight(){

    if(!running){
        return;
    }

    playerX += 45;

    if(playerX > 222){
        playerX = 222;
    }

    player.style.left =
        playerX + "px";
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    clearInterval(timer);

    running = false;

    const name =
        playerNameInput.value.trim();


    if(score > best){

        best = score;

        bestPlayer = name;

        localStorage.setItem(
            "ebadBestScore",
            best
        );

        localStorage.setItem(
            "ebadBestPlayer",
            bestPlayer
        );

        document.getElementById(
            "best"
        ).textContent =
            best;

        showBestPlayer();

        document.getElementById(
            "message"
        ).textContent =
            "🏆 NEW HIGH SCORE, " +
            name +
            "! Score: " +
            score;

    }else{

        document.getElementById(
            "message"
        ).textContent =
            "💥 GAME OVER, " +
            name +
            "! Score: " +
            score +
            " | Best: " +
            best;
    }
}


/* =========================
   RESTART
========================= */

function restartGame(){

    clearInterval(timer);

    running = false;

    score = 0;
    lives = 3;
    level = 1;

    speed = 3.5;

    playerX = 132;

    document.getElementById(
        "score"
    ).textContent =
        0;

    document.getElementById(
        "lives"
    ).textContent =
        3;

    document.getElementById(
        "level"
    ).textContent =
        1;

    player.style.left =
        "132px";

    resetEnemies();

    document.getElementById(
        "message"
    ).textContent =
        "Enter your name and press START.";
}

</script>

</body>
</html>
