<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ebad Gaming</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

:root{
  --main-color:#ff3030;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080812;
  color:#fff;
  line-height:1.6;
}

header{
  background:#11111d;
  padding:18px 25px;
  border-bottom:2px solid var(--main-color);
  position:sticky;
  top:0;
  z-index:20;
}

.nav{
  max-width:1150px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.logo{
  font-size:26px;
  font-weight:bold;
  color:var(--main-color);
}

.logo span{
  color:#fff;
}

nav a{
  color:#fff;
  text-decoration:none;
  margin-left:18px;
  font-weight:bold;
}

nav a:hover{
  color:var(--main-color);
}

.hero{
  min-height:440px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:35px 20px;
  background:
    radial-gradient(circle,#27204d,#10101c 55%,#080812);
}

.hero h1{
  font-size:clamp(40px,7vw,76px);
  margin-bottom:15px;
}

.hero h1 span{
  color:var(--main-color);
}

.hero p{
  color:#ccc;
  font-size:20px;
  margin-bottom:25px;
}

.btn{
  display:inline-block;
  border:0;
  background:var(--main-color);
  color:#fff;
  padding:12px 22px;
  border-radius:9px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
}

.btn:hover{
  filter:brightness(1.12);
}

section{
  max-width:1150px;
  margin:auto;
  padding:60px 20px;
}

.title{
  text-align:center;
  font-size:35px;
  margin-bottom:35px;
}

.title span{
  color:var(--main-color);
}

/* Games */

.games{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.card{
  background:#151522;
  border:1px solid #29293d;
  border-radius:15px;
  padding:25px 15px;
  text-align:center;
  transition:.2s;
}

.card:hover{
  border-color:var(--main-color);
  transform:translateY(-5px);
}

.icon{
  font-size:55px;
  margin-bottom:10px;
}

.card h3{
  margin-bottom:8px;
}

.card p{
  color:#aaa;
  margin-bottom:18px;
  min-height:52px;
}

/* Racing */

.game-area{
  text-align:center;
}

.game-info{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.info-box{
  background:#151522;
  border:1px solid #29293d;
  padding:10px 16px;
  border-radius:10px;
  font-weight:bold;
}

.game-box{
  position:relative;
  width:320px;
  height:520px;
  max-width:90vw;
  margin:auto;
  overflow:hidden;
  background:#303030;
  border:4px solid #fff;
  border-radius:12px;
}

.road{
  position:absolute;
  inset:0;
  background:#303030;
}

.line,
.line2{
  position:absolute;
  width:8px;
  height:85px;
  background:#fff;
  top:-100px;
}

.line{
  left:33%;
}

.line2{
  right:33%;
}

.player{
  position:absolute;
  width:55px;
  height:75px;
  left:132px;
  bottom:25px;
  font-size:50px;
  z-index:5;
  transition:left .07s;
}

.enemy{
  position:absolute;
  width:55px;
  height:75px;
  top:-100px;
  font-size:50px;
  z-index:4;
}

  left:30px;
}
