<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Zombie Attack - Ebad Gaming</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --accent:#35e05a;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    text-align:center;
    background:
        radial-gradient(circle at top,#17221a,#070a08 58%,#040605);
}

header{
    background:rgba(8,12,9,.96);
    border-bottom:2px solid var(--accent);
    padding:16px 20px;
}

header a{
    color:#fff;
    text-decoration:none;
    font-weight:800;
}

.page{
    padding:18px 12px 45px;
}

h1{
    margin:8px 0 4px;
    color:#67f27d;
    font-size:clamp(30px,6vw,50px);
}

.subtitle{
    color:#a3aaa5;
    margin-bottom:15px;
}

.info{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:15px 0;
}

.info-box{
    background:#121913;
    border:1px solid #2e4833;
    border-radius:10px;
    padding:9px 14px;
    font-weight:800;
}

.player-name-box{
    width:min(380px,94vw);
    margin:0 auto 15px;
    padding:15px;
    background:#111711;
    border:1px solid #2e4833;
    border-radius:14px;
    text-align:left;
}

.player-name-box label{
    display:block;
    color:#aeb7b0;
    font-size:14px;
    margin-bottom:7px;
}

.player-name-box input{
    width:100%;
    height:48px;
    padding:10px 14px;
    border-radius:9px;
    border:2px solid #37503b;
    background:#080d09;
    color:#fff;
    font-size:17px;
    outline:none;
}

.player-name-box input:focus{
    border-color:var(--accent);
}

.best-player{
    margin:8px 0 12px;
    color:#ffd84d;
    font-weight:800;
}

.game-frame{
    width:min(400px,95vw);
    margin:0 auto;
    padding:10px;
    background:linear-gradient(180deg,#182018,#0d120e);
    border:1px solid #344737;
    border-radius:22px;
}

.game-box{
    position:relative;
    width:100%;
    aspect-ratio:360/540;
    overflow:hidden;
    border:4px solid #d9ffe0;
    border-radius:16px;
    background:#0d160f;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

.message{
    min-height:30px;
    margin:13px 0 7px;
    color:#ffd43b;
    font-weight:800;
}

.actions{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:10px;
    background:var(--accent);
    color:#071008;
    padding:12px 18px;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
}

.btn:hover{
    filter:brightness(1.08);
}

.fire-btn{
    background:#ff4545;
    color:#fff;
}

.reset-btn{
    background:#292e2b;
    color:#fff;
    border:1px solid #47544a;
}

.help{
    color:#8e9991;
    margin-top:10px;
    font-size:13px;
    line-height:1.5;
}

@media(max-width:600px){
    .game-frame{
        width:min(390px,96vw);
    }

    .btn{
        min-width:130px;
    }
}
</style>
</head>

<body>

<header>
<a href="games.html">← Back to Games</a>
</header>

<div class="page">

<h1>🧟 Zombie Attack</h1>

<p class="subtitle">
Move, aim and survive the zombie attack.
</p>

<div class="player-name-box">

<label for="playerName">
👤 Player Name
</label>

<input
id="playerName"
type="text"
maxlength="30"
autocomplete="off"
spellcheck="false"
placeholder="Enter your name"
>

</div>

<div class="info">

<div class="info-box">
🏆 Score:
<span id="score">0</span>
</div>

<div class="info-box">
❤️ Lives:
<span id="lives">3</span>
</div>

<div class="info-box">
⚡ Wave:
<span id="wave">1</span>
</div>

<div class="info-box">
🥇 Best:
<span id="best">0</span>
</div>

</div>

<div class="best-player" id="bestPlayer">
🥇 Best Player: Nobody yet
</div>

<div class="game-frame">

<div class="game-box" id="gameBox">

<canvas
id="gameCanvas"
width="360"
height="540"
></canvas>

</div>

<div
class="message"
id="message"
>
Enter your name and press START.
</div>

<div class="actions">

<button
class="btn"
onclick="startGame()"
>
START GAME
</button>

<button
class="btn"
onclick="restartGame()"
>
RESTART
</button>

<button
class="btn fire-btn"
onclick="shoot()"
>
🔫 FIRE
</button>

<button
class="btn reset-btn"
onclick="resetBestScore()"
>
🗑️ RESET BEST
</button>

</div>

<p class="help">
📱 Mobile: road par swipe/drag = move, tap ya FIRE = shoot<br>
💻 Computer: ← → = move, SPACE = shoot
</p>

</div>

</div>

<script>

/* =========================
   BASIC SETUP
========================= */

const canvas =
document.getElementById("gameCanvas");

const ctx =
canvas.getContext("2d");

const gameBox =
document.getElementById("gameBox");

const W = canvas.width;
const H = canvas.height;


/* =========================
   PLAYER DATA
========================= */

const playerNameInput =
document.getElementById("playerName");

const savedName =
localStorage.getItem("ebadZombiePlayer");

if(savedName){
    playerNameInput.value = savedName;
}

playerNameInput.addEventListener(
    "input",
    function(){
        localStorage.setItem(
            "ebadZombiePlayer",
            this.value
        );
    }
);


/* =========================
   GAME VARIABLES
========================= */

let running = false;
let timer = null;
let animationId = null;

let score = 0;
let lives = 3;
let wave = 1;

let speed = 55;
let spawnInterval = 900;
let spawnTimer = 0;

let playerX = W / 2;
let playerY = 465;

let bullets = [];
let zombies = [];

let best =
Number(
    localStorage.getItem("ebadZombieBest")
) || 0;

let bestPlayer =
localStorage.getItem("ebadZombieBestPlayer")
|| "";

document.getElementById("best").textContent = best;

updateBestPlayer();


/* =========================
   BACKGROUND STARS
========================= */

const stars = [];

for(let i=0;i<75;i++){

    stars.push({
        x:Math.random()*W,
        y:Math.random()*H,
        r:Math.random()*1.8+0.5,
        s:8+Math.random()*20
    });

}


/* =========================
   INFO
========================= */

function updateStats(){

    document.getElementById(
        "score"
    ).textContent = score;

    document.getElementById(
        "lives"
    ).textContent = lives;

    document.getElementById(
        "wave"
    ).textContent = wave;

}

function updateBestPlayer(){

    document.getElementById(
        "bestPlayer"
    ).textContent =
        bestPlayer && best > 0
        ? "🥇 Best Player: "+bestPlayer+" — "+best
        : "🥇 Best Player: Nobody yet";
}


/* =========================
   START
========================= */

function startGame(){

    if(running){
        return;
    }

    const name =
        playerNameInput.value.trim();

    if(!name){

        alert(
            "Please enter your name first."
        );

        playerNameInput.focus();

        return;
    }

    localStorage.setItem(
        "ebadZombiePlayer",
        name
    );

    running = true;

    score = 0;
    lives = 3;
    wave = 1;

    speed = 55;
    spawnInterval = 900;
    spawnTimer = 0;

    playerX = W/2;

    bullets = [];
    zombies = [];

    updateStats();

    document.getElementById(
        "message"
    ).textContent =
        "🧟 Good luck, "+name+"!";

    lastTime =
        performance.now();

    animationId =
        requestAnimationFrame(
            loop
        );

}


/* =========================
   RESTART
========================= */

function restartGame(){

    running = false;

    if(timer){
        clearInterval(timer);
        timer = null;
    }

    if(animationId){
        cancelAnimationFrame(
            animationId
        );
        animationId = null;
    }

    score = 0;
    lives = 3;
    wave = 1;

    speed = 55;
    spawnInterval = 900;
    spawnTimer = 0;

    playerX = W/2;

    bullets = [];
    zombies = [];

    updateStats();

    document.getElementById(
        "message"
    ).textContent =
        "Enter your name and press START.";

    draw(0);
}


/* =========================
   PLAYER DRAW
========================= */

function drawPlayer(){

    /* shadow */

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        playerX,
        playerY+33,
        25,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* body */

    ctx.fillStyle =
        "#35e05a";

    ctx.fillRect(
        playerX-20,
        playerY-5,
        40,
        38
    );


    /* head */

    ctx.fillStyle =
        "#efc5a5";

    ctx.beginPath();

    ctx.arc(
        playerX,
        playerY-18,
        13,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* hair */

    ctx.fillStyle =
        "#2c241f";

    ctx.beginPath();

    ctx.arc(
        playerX,
        playerY-24,
        12,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /* gun */

    ctx.fillStyle =
        "#b8b8b8";

    ctx.fillRect(
        playerX-4,
        playerY-78,
        8,
        46
    );


    ctx.fillStyle =
        "#3e3e3e";

    ctx.fillRect(
        playerX-9,
        playerY-84,
        18,
        11
    );


    /* body belt */

    ctx.fillStyle =
        "#222";

    ctx.fillRect(
        playerX-20,
        playerY+10,
        40,
        6
    );

}


/* =========================
   ZOMBIE DRAW
========================= */

function drawZombie(z){

    ctx.save();

    ctx.translate(
        z.x,
        z.y
    );


    /* shadow */

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        27,
        20,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* body */

    ctx.fillStyle =
        z.type===0
        ? "#6c9e58"
        : "#8cba6b";

    ctx.fillRect(
        -17,
        -2,
        34,
        36
    );


    /* head */

    ctx.fillStyle =
        "#82ad67";

    ctx.beginPath();

    ctx.arc(
        0,
        -20,
        18,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* eyes */

    ctx.fillStyle =
        "#f5ff77";

    ctx.beginPath();

    ctx.arc(
        -6,
        -22,
        3,
        0,
        Math.PI*2
    );

    ctx.arc(
        6,
        -22,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* mouth */

    ctx.fillStyle =
        "#211";

    ctx.fillRect(
        -7,
        -12,
        14,
        5
    );


    /* arms */

    ctx.strokeStyle =
        "#82ad67";

    ctx.lineWidth=8;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        -15,
        6
    );

    ctx.lineTo(
        -27,
        16
    );

    ctx.moveTo(
        15,
        6
    );

    ctx.lineTo(
        27,
        16
    );

    ctx.stroke();


    ctx.restore();

}


/* =========================
   BULLET DRAW
========================= */

function drawBullet(b){

    ctx.save();

    ctx.fillStyle =
        "#ffe600";

    ctx.shadowColor =
        "#ffe600";

    ctx.shadowBlur =
        12;

    ctx.fillRect(
        b.x-3,
        b.y-11,
        6,
        22
    );

    ctx.restore();

}


/* =========================
   BACKGROUND
========================= */

function drawBackground(dt){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#071009"
    );

    gradient.addColorStop(
        .65,
        "#0f1a10"
    );

    gradient.addColorStop(
        1,
        "#172518"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* stars */

    stars.forEach(
        s=>{

            s.y +=
                s.s * dt;

            if(
                s.y>H
            ){

                s.y=-5;
                s.x=Math.random()*W;
            }

            ctx.fillStyle =
                "rgba(220,255,220,.8)";

            ctx.beginPath();

            ctx.arc(
                s.x,
                s.y,
                s.r,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    );


    /* ground */

    ctx.fillStyle =
        "#142015";

    ctx.fillRect(
        0,
        435,
        W,
        105
    );


    /* ground stripes */

    ctx.strokeStyle =
        "#203322";

    ctx.lineWidth=2;

    for(
        let y=450;
        y<540;
        y+=18
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();
    }


    /* top trees */

    ctx.fillStyle =
        "#132417";

    ctx.beginPath();

    ctx.arc(
        35,
        70,
        50,
        0,
        Math.PI*2
    );

    ctx.arc(
        125,
        90,
        60,
        0,
        Math.PI*2
    );

    ctx.arc(
        245,
        80,
        55,
        0,
        Math.PI*2
    );

    ctx.arc(
        335,
        75,
        50,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =========================
   SPAWN ZOMBIE
========================= */

function spawnZombie(){

    zombies.push({

        x:
            25+
            Math.random()*
            310,

        y:-40,

        type:
            Math.random()<.5
            ? 0
            : 1
    });

}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(!running){
        return;
    }

    bullets.push({

        x:playerX,

        y:playerY-85,

        speed:470
    });


    document.getElementById(
        "message"
    ).textContent =
        "🔫 FIRE!";

}


/* =========================
   MOVE
========================= */

function moveLeft(){

    if(!running){
        return;
    }

    playerX -= 35;

    if(
        playerX<30
    ){
        playerX=30;
    }

}

function moveRight(){

    if(!running){
        return;
    }

    playerX += 35;

    if(
        playerX>330
    ){
        playerX=330;
    }

}


/* =========================
   LOOP
========================= */

let lastTime=0;

function loop(time){

    if(!running){
        return;
    }

    const dt =
        Math.min(
            (time-lastTime)/1000,
            .05
        );

    lastTime=time;

    update(dt);

    draw(dt);

    animationId =
        requestAnimationFrame(
            loop
        );
}


/* =========================
   UPDATE
========================= */

function update(dt){

    /* spawn */

    spawnTimer +=
        dt*1000;

    if(
        spawnTimer>=spawnInterval
    ){

        spawnTimer=0;

        spawnZombie();
    }


    /* zombies */

    for(
        let i=zombies.length-1;
        i>=0;
        i--
    ){

        const z =
            zombies[i];

        z.y +=
            speed*dt;


        /* player collision */

        if(
            Math.hypot(
                z.x-playerX,
                z.y-playerY
            )<35
        ){

            zombies.splice(
                i,
                1
            );

            lives--;

            updateStats();

            document.getElementById(
                "message"
            ).textContent =
                "💥 Zombie hit you!";

            if(
                lives<=0
            ){

                gameOver();
                return;
            }

            continue;
        }


        /* reached bottom */

        if(
            z.y>555
        ){

            zombies.splice(
                i,
                1
            );

            lives--;

            updateStats();

            if(
                lives<=0
            ){

                gameOver();
                return;
            }

            continue;
        }

    }


    /* bullets */

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b =
            bullets[i];

        b.y -=
            b.speed*dt;


        if(
            b.y<-20
        ){

            bullets.splice(
                i,
                1
            );

            continue;
        }


        /* bullet collision */

        for(
            let j=zombies.length-1;
            j>=0;
            j--
        ){

            const z =
                zombies[j];


            if(
                Math.hypot(
                    b.x-z.x,
                    b.y-z.y
                )<28
            ){

                bullets.splice(
                    i,
                    1
                );

                zombies.splice(
                    j,
                    1
                );

                score++;

                updateWave();

                updateStats();

                document.getElementById(
                    "message"
                ).textContent =
                    "💥 Zombie destroyed!";

                break;
            }
        }
    }

}


/* =========================
   WAVE
========================= */

function updateWave(){

    const newWave =
        Math.floor(
            score/10
        )+1;


    if(
        newWave!==wave
    ){

        wave=newWave;

        speed =
            55+
            (wave-1)*15;

        spawnInterval =
            Math.max(
                330,
                900-
                (wave-1)*70
            );

        document.getElementById(
            "message"
        ).textContent =
            "⚡ WAVE "+
            wave+
            "!";
    }

}


/* =========================
   DRAW
========================= */

function draw(dt){

    drawBackground(dt);

    zombies.forEach(
        drawZombie
    );

    bullets.forEach(
        drawBullet
    );

    drawPlayer();

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running=false;

    if(animationId){

        cancelAnimationFrame(
            animationId
        );

        animationId=null;
    }

    const name =
        playerNameInput.value.trim();


    if(
        score>best
    ){

        best=score;

        bestPlayer=name;

        localStorage.setItem(
            "ebadZombieBest",
            best
        );

        localStorage.setItem(
            "ebadZombieBestPlayer",
            bestPlayer
        );

        document.getElementById(
            "best"
        ).textContent =
            best;

        updateBestPlayer();

        document.getElementById(
            "message"
        ).textContent =
            "🏆 NEW HIGH SCORE, "+
            name+
            "! Score: "+
            score;

    }else{

        document.getElementById(
            "message"
        ).textContent =
            "💀 GAME OVER, "+
            name+
            "! Score: "+
            score;
    }
}


/* =========================
   RESET BEST
========================= */

function resetBestScore(){

    const ok =
        confirm(
            "Kya aap Zombie Best Score aur Best Player delete karna chahte hain?"
        );

    if(!ok){
        return;
    }

    localStorage.removeItem(
        "ebadZombieBest"
    );

    localStorage.removeItem(
        "ebadZombieBestPlayer"
    );

    best=0;
    bestPlayer="";

    document.getElementById(
        "best"
    ).textContent=0;

    updateBestPlayer();

    document.getElementById(
        "message"
    ).textContent =
        "✅ Best Score reset ho gaya!";
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event){

        const active =
            document.activeElement;

        if(
            active &&
            (
                active.tagName==="INPUT" ||
                active.tagName==="TEXTAREA"
            )
        ){
            return;
        }


        if(
            event.key==="ArrowLeft"
        ){

            event.preventDefault();
            moveLeft();
        }


        if(
            event.key==="ArrowRight"
        ){

            event.preventDefault();
            moveRight();
        }


        if(
            event.code==="Space"
        ){

            event.preventDefault();
            shoot();
        }

    }
);


/* =========================
   MOBILE TOUCH
========================= */

let touchStartX=0;
let touchStartY=0;
let lastTouchX=0;
let dragging=false;

gameBox.addEventListener(
    "touchstart",
    function(event){

        if(
            !running ||
            !event.touches.length
        ){
            return;
        }

        touchStartX =
            event.touches[0].clientX;

        touchStartY =
            event.touches[0].clientY;

        lastTouchX =
            touchStartX;

        dragging=true;

        event.preventDefault();

    },
    {passive:false}
);


gameBox.addEventListener(
    "touchmove",
    function(event){

        if(
            !running ||
            !dragging ||
            !event.touches.length
        ){
            return;
        }

        const currentX =
            event.touches[0].clientX;

        const currentY =
            event.touches[0].clientY;


        const dx =
            currentX-lastTouchX;


        if(
            Math.abs(dx)>3
        ){

            if(
                dx<0
            ){

                moveLeft();

            }else{

                moveRight();
            }


            lastTouchX=
                currentX;
        }

        event.preventDefault();

    },
    {passive:false}
);


gameBox.addEventListener(
    "touchend",
    function(event){

        if(
            !running
        ){
            dragging=false;
            return;
        }

        const endX =
            event.changedTouches.length
            ? event.changedTouches[0].clientX
            : lastTouchX;

        const endY =
            event.changedTouches.length
            ? event.changedTouches[0].clientY
            : touchStartY;


        const dx =
            endX-touchStartX;

        const dy =
            endY-touchStartY;


        /* tap = fire */

        if(
            Math.abs(dx)<20 &&
            Math.abs(dy)<20
        ){

            shoot();
        }


        dragging=false;

        event.preventDefault();

    },
    {passive:false}
);


gameBox.addEventListener(
    "touchcancel",
    function(){

        dragging=false;

    }
);


/* =========================
