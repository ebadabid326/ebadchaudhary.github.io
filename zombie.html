<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zombie Attack - Ebad Gaming</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    margin:0;
    background:#070a08;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    text-align:center;
}

header{
    background:#11151a;
    padding:16px;
    border-bottom:2px solid #35e05a;
}

header a{
    color:#fff;
    text-decoration:none;
    font-weight:bold;
}

h1{
    color:#35e05a;
    margin:20px 0 8px;
    font-size:clamp(30px,6vw,48px);
}

.subtitle{
    color:#aaa;
    margin-bottom:12px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:15px;
}

.stat{
    background:#151c16;
    border:1px solid #29452f;
    border-radius:10px;
    padding:9px 15px;
    font-weight:bold;
}

.game-wrap{
    width:min(390px,94vw);
    margin:0 auto;
    padding:10px;
    background:#111811;
    border:1px solid #2d4030;
    border-radius:18px;
}

#gameCanvas{
    display:block;
    width:100%;
    height:auto;
    border:4px solid #35e05a;
    border-radius:14px;
    background:#101810;
    touch-action:none;
}

.message{
    min-height:30px;
    color:#ffd84d;
    font-weight:bold;
    margin:12px 0 7px;
}

/* START / RESTART */

.actions{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    border:0;
    border-radius:10px;
    background:#35e05a;
    color:#071008;
    padding:13px 20px;
    margin:5px;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
    min-width:145px;
}

.btn:hover{
    filter:brightness(1.08);
}

.controls{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:10px;
}

.control{
    width:85px;
    height:56px;
    border:0;
    border-radius:11px;
    background:#1b241c;
    border:1px solid #38533c;
    color:#fff;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

.help{
    color:#999;
    margin:10px 0 25px;
    font-size:14px;
}

@media(max-width:450px){
    .btn{
        width:100%;
        max-width:180px;
    }
}

</style>
</head>

<body>

<header>
<a href="games.html">← Back to Games</a>
</header>

<h1>🧟 Zombie Attack</h1>

<p class="subtitle">
Survive the zombies and beat your score.
</p>

<div class="stats">

<div class="stat">
🎯 Score:
<span id="score">0</span>
</div>

<div class="stat">
❤️ Lives:
<span id="lives">3</span>
</div>

<div class="stat">
⚡ Wave:
<span id="wave">1</span>
</div>

</div>


<div class="game-wrap">

<canvas
id="gameCanvas"
width="360"
height="540"
></canvas>


<div
class="message"
id="message"
>
Press START GAME to begin!
</div>


<div class="actions">

<button
type="button"
class="btn"
onclick="startGame()"
>
▶ START GAME
</button>

<button
type="button"
class="btn"
onclick="restartGame()"
>
↻ RESTART
</button>

</div>


<div class="controls">

<button
type="button"
class="control"
onclick="moveLeft()"
>
⬅️
</button>

<button
type="button"
class="control"
onclick="shoot()"
>
🔫
</button>

<button
type="button"
class="control"
onclick="moveRight()"
>
➡️
</button>

</div>

<p class="help">
Mobile: ⬅️ ➡️ move &nbsp; | &nbsp; 🔫 shoot
<br>
Computer: ← → move &nbsp; | &nbsp; SPACE shoot
</p>

</div>


<script>

const canvas=
document.getElementById(
"gameCanvas"
);

const ctx=
canvas.getContext("2d");

const W=360;
const H=540;


let playerX=180;

let score=0;
let lives=3;
let wave=1;

let running=false;

let bullets=[];
let zombies=[];

let lastTime=0;
let spawnTimer=0;

let spawnInterval=800;
let zombieSpeed=75;

let animationId=null;


/* =========================
   STARS / BACKGROUND
========================= */

const stars=[];

for(
    let i=0;
    i<70;
    i++
){

    stars.push({

        x:Math.random()*W,

        y:Math.random()*H,

        size:Math.random()*2+1

    });

}


/* =========================
   UPDATE INFO
========================= */

function updateStats(){

    document.getElementById(
        "score"
    ).textContent=score;

    document.getElementById(
        "lives"
    ).textContent=lives;

    document.getElementById(
        "wave"
    ).textContent=wave;

}


/* =========================
   BACKGROUND
========================= */

function drawBackground(dt){

    ctx.fillStyle="#101810";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* night sky */

    ctx.fillStyle="#0a110b";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* stars */

    for(
        const s of stars
    ){

        s.y+=
            25*dt;

        if(
            s.y>H
        ){
            s.y=-5;
            s.x=Math.random()*W;
        }

        ctx.fillStyle="#d8ffd8";

        ctx.fillRect(
            s.x,
            s.y,
            s.size,
            s.size
        );

    }


    /* ground */

    ctx.fillStyle="#162216";

    ctx.fillRect(
        0,
        500,
        W,
        40
    );


    /* ground lines */

    ctx.strokeStyle="#233523";

    for(
        let y=505;
        y<540;
        y+=12
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();

    }

}


/* =========================
   PLAYER
========================= */

function drawPlayer(){

    /* body */

    ctx.fillStyle="#35e05a";

    ctx.fillRect(
        playerX-22,
        470,
        44,
        38
    );


    /* head */

    ctx.fillStyle="#f3c8a8";

    ctx.beginPath();

    ctx.arc(
        playerX,
        451,
        13,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* gun */

    ctx.fillStyle="#bdbdbd";

    ctx.fillRect(
        playerX-4,
        395,
        8,
        45
    );


    ctx.fillStyle="#444";

    ctx.fillRect(
        playerX-8,
        388,
        16,
        10
    );


    ctx.fillStyle="#222";

    ctx.fillRect(
        playerX-8,
        430,
        16,
        22
    );

}


/* =========================
   ZOMBIE
========================= */

function drawZombie(z){

    ctx.font="42px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
        "🧟",
        z.x,
        z.y
    );

}


/* =========================
   BULLET
========================= */

function drawBullet(b){

    ctx.fillStyle="#ffe600";

    ctx.shadowColor="#ffe600";
    ctx.shadowBlur=12;

    ctx.fillRect(
        b.x-3,
        b.y-10,
        6,
        20
    );

    ctx.shadowBlur=0;

}


/* =========================
   SPAWN
========================= */

function spawnZombie(){

    zombies.push({

        x:
            25+
            Math.random()*
            310,

        y:-35

    });

}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(
        !running
    ){
        return;
    }


    bullets.push({

        x:playerX,

        y:425

    });

}


/* =========================
   MOVE
========================= */

function moveLeft(){

    if(
        !running
    ){
        return;
    }


    playerX-=30;


    if(
        playerX<25
    ){

        playerX=25;

    }

}


function moveRight(){

    if(
        !running
    ){
        return;
    }


    playerX+=30;


    if(
        playerX>335
    ){

        playerX=335;

    }

}


/* =========================
   START GAME
========================= */

function startGame(){

    if(
        running
    ){
        return;
    }


    score=0;
    lives=3;
    wave=1;

    playerX=180;

    bullets=[];
    zombies=[];

    spawnTimer=0;

    spawnInterval=800;

    zombieSpeed=75;

    running=true;


    updateStats();


    document.getElementById(
        "message"
    ).textContent=
        "🧟 Zombies are coming!";


    lastTime=
        performance.now();


    animationId=
        requestAnimationFrame(
            gameLoop
        );

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(time){

    if(
        !running
    ){
        return;
    }


    const dt=
        Math.min(
            (time-lastTime)/1000,
            .05
        );


    lastTime=time;


    update(dt);

    draw(dt);


    animationId=
        requestAnimationFrame(
            gameLoop
        );

}


/* =========================
   UPDATE GAME
========================= */

function update(dt){

    /* Spawn */

    spawnTimer+=
        dt*1000;


    if(
        spawnTimer>=spawnInterval
    ){

        spawnTimer=0;

        spawnZombie();

    }


    /* Zombies */

    for(
        let i=zombies.length-1;
        i>=0;
        i--
    ){

        const z=
            zombies[i];


        z.y+=
            zombieSpeed*dt;


        if(
            z.y>=445
        ){

            zombies.splice(
                i,
                1
            );


            lives--;


            updateStats();


            if(
                lives<=0
            ){

                gameOver();

                return;

            }


            document.getElementById(
                "message"
            ).textContent=
                "💥 A zombie reached you!";

        }

    }


    /* Bullets */

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b=
            bullets[i];


        b.y-=
            450*dt;


        if(
            b.y<-20
        ){

            bullets.splice(
                i,
                1
            );

        }

    }


    /* Hit detection */

    for(
        let bi=bullets.length-1;
        bi>=0;
        bi--
    ){

        const b=
            bullets[bi];


        for(
            let zi=zombies.length-1;
            zi>=0;
            zi--
        ){

            const z=
                zombies[zi];


            const dx=
                b.x-z.x;

            const dy=
                b.y-z.y;


            const distance=
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(
                distance<28
            ){

                bullets.splice(
                    bi,
                    1
                );

                zombies.splice(
                    zi,
                    1
                );


                score++;


                updateWave();


                updateStats();


                document.getElementById(
                    "message"
                ).textContent=
                    "💥 Zombie destroyed!";

                break;

            }

        }

    }

}


/* =========================
   WAVE
========================= */

function updateWave(){

    const newWave=
        Math.floor(
            score/10
        )+1;


    if(
        newWave!==wave
    ){

        wave=
            newWave;


        zombieSpeed=
            75+
            (wave-1)*18;


        spawnInterval=
            Math.max(
                350,
                800-
                (wave-1)*70
            );


        document.getElementById(
            "message"
        ).textContent=
            "⚡ WAVE "+
            wave+
            "!";

    }

}


/* =========================
   DRAW
========================= */

function draw(dt){

    drawBackground(dt);


    zombies.forEach(
        drawZombie
    );


    bullets.forEach(
        drawBullet
    );


    drawPlayer();

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running=false;


    if(
        animationId
    ){

        cancelAnimationFrame(
            animationId
        );

    }


    document.getElementById(
        "message"
    ).textContent=
        "💀 GAME OVER! Score: "+
        score;

}


/* =========================
   RESTART
========================= */

function restartGame(){

    if(
        animationId
    ){

        cancelAnimationFrame(
            animationId
        );

    }


    running=false;


    score=0;
    lives=3;
    wave=1;

    playerX=180;

    bullets=[];
    zombies=[];

    spawnTimer=0;

    spawnInterval=800;

    zombieSpeed=75;


    updateStats();


    draw(0);


    document.getElementById(
        "message"
    ).textContent=
        "Press START GAME to begin!";

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key==="ArrowLeft"
        ){

            e.preventDefault();

            moveLeft();

        }


        if(
            e.key==="ArrowRight"
        ){

            e.preventDefault();

            moveRight();

        }


        if(
            e.code==="Space"
        ){

            e.preventDefault();

            shoot();

        }

    }
);


updateStats();

draw(0);

</script>

</body>
</html>
