<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Zombie Attack - Ebad Gaming</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --green:#35e05a;
    --dark:#050906;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;
    text-align:center;

    background:
        radial-gradient(
            circle at top,
            #17251a,
            #070a08 55%,
            #030504
        );

    overflow-x:hidden;
}


/* =========================
   HEADER
========================= */

header{
    background:
        rgba(7,12,8,.97);

    border-bottom:
        2px solid
        var(--green);

    padding:
        16px
        20px;
}

header a{
    color:#fff;
    text-decoration:none;
    font-weight:800;
}


/* =========================
   PAGE
========================= */

.page{
    padding:
        16px
        12px
        45px;
}

h1{
    margin:
        8px
        0
        4px;

    font-size:
        clamp(
            30px,
            6vw,
            50px
        );

    color:#65f67a;
}

.subtitle{
    color:#a3aaa4;
    margin-bottom:15px;
}


/* =========================
   STATS
========================= */

.stats{
    display:flex;

    justify-content:center;

    align-items:center;

    gap:10px;

    flex-wrap:wrap;

    margin:
        15px
        0;
}

.stat{
    background:#111812;

    border:
        1px solid
        #2d4731;

    border-radius:10px;

    padding:
        9px
        14px;

    font-weight:800;
}

.best{
    color:#ffd84d;

    font-weight:800;

    margin-bottom:12px;
}


/* =========================
   GAME FRAME
========================= */

.game-frame{
    width:
        min(
            410px,
            95vw
        );

    margin:0 auto;

    padding:10px;

    background:
        linear-gradient(
            180deg,
            #172018,
            #0d120e
        );

    border:
        1px solid
        #344b38;

    border-radius:22px;

    box-shadow:
        0 20px 55px
        rgba(0,0,0,.45);
}


/* =========================
   GAME AREA
========================= */

.game-box{
    position:relative;

    width:100%;

    aspect-ratio:
        360 / 540;

    overflow:hidden;

    border:
        4px solid
        #dfffe4;

    border-radius:16px;

    background:
        linear-gradient(
            180deg,
            #071008 0%,
            #0d170f 45%,
            #172018 100%
        );

    touch-action:none;

    user-select:none;

    -webkit-user-select:none;
}


/* =========================
   BACKGROUND
========================= */

.star{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#e8ffe9;

    opacity:.8;

    pointer-events:none;
}

.moon{
    position:absolute;

    top:28px;
    right:28px;

    width:46px;
    height:46px;

    border-radius:50%;

    background:#d9f1d5;

    box-shadow:
        0 0 28px
        rgba(
            220,
            255,
            210,
            .18
        );

    pointer-events:none;
}

.moon::after{
    content:"";

    position:absolute;

    width:46px;
    height:46px;

    left:-9px;
    top:-4px;

    border-radius:50%;

    background:#081008;
}

.ground{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:105px;

    background:
        repeating-linear-gradient(
            0deg,
            #182219 0 18px,
            #101710 18px 36px
        );
}

.ground-line{
    position:absolute;

    left:0;
    right:0;

    height:2px;

    background:
        rgba(
            90,
            130,
            90,
            .2
        );
}

.g1{
    bottom:80px;
}

.g2{
    bottom:48px;
}

.g3{
    bottom:20px;
}


/* =========================
   PLAYER
========================= */

.player{
    position:absolute;

    left:50%;
    bottom:42px;

    width:74px;
    height:120px;

    z-index:10;

    will-change:transform;
}

.player-head{
    position:absolute;

    left:25px;
    top:0;

    width:25px;
    height:25px;

    border-radius:50%;

    background:#f1c6a6;
}

.player-body{
    position:absolute;

    left:15px;
    top:25px;

    width:44px;
    height:65px;

    border-radius:
        14px
        14px
        10px
        10px;

    background:
        linear-gradient(
            180deg,
            #46e76a,
            #1b8034
        );

    box-shadow:
        inset
        0 4px 0
        rgba(
            255,
            255,
            255,
            .16
        );
}

.player-shoulder{
    position:absolute;

    left:8px;
    top:36px;

    width:58px;
    height:20px;

    border-radius:10px;

    background:#23582f;
}

.player-gun{
    position:absolute;

    left:50%;
    top:14px;

    width:10px;
    height:72px;

    transform:
        translateX(-50%);

    border-radius:6px;

    background:
        linear-gradient(
            90deg,
            #555,
            #d7d7d7,
            #555
        );

    z-index:8;
}

.player-hand{
    position:absolute;

    top:58px;
    left:7px;

    width:17px;
    height:17px;

    border-radius:50%;

    background:#efc4a3;

    z-index:9;
}

.player-hand.right{
    left:auto;
    right:7px;
}


/* =========================
   ZOMBIES
========================= */

.zombie{
    position:absolute;

    width:62px;
    height:84px;

    z-index:8;

    will-change:transform;

    filter:
        drop-shadow(
            0 7px 5px
            rgba(0,0,0,.45)
        );
}

.zombie-head{
    position:absolute;

    left:15px;
    top:0;

    width:32px;
    height:32px;

    border-radius:
        48%
        52%
        45%
        55%;

    background:
        linear-gradient(
            180deg,
            #7ed67d,
            #3a8b45
        );

    border:
        2px solid
        #1d4924;

    z-index:3;
}

.zombie-body{
    position:absolute;

    left:12px;
    top:25px;

    width:38px;
    height:52px;

    border-radius:
        13px
        13px
        8px
        8px;

    background:
        linear-gradient(
            180deg,
            #6bc66d,
            #2a6e37
        );

    border:
        2px solid
        #1d4924;
}

.eye{
    position:absolute;

    top:11px;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#ff5555;

    box-shadow:
        0 0 6px
        rgba(
            255,
            60,
            60,
            .7
        );
}

.eye.left{
    left:7px;
}

.eye.right{
    right:7px;
}

.zombie-arm{
    position:absolute;

    top:34px;

    width:10px;
    height:40px;

    border-radius:8px;

    background:#4eaa55;
}

.zombie-arm.left{
    left:3px;

    transform:
        rotate(28deg);
}

.zombie-arm.right{
    right:3px;

    transform:
        rotate(-28deg);
}


/* =========================
   BULLET
========================= */

.bullet{
    position:absolute;

    width:6px;
    height:20px;

    border-radius:5px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #ffe600
        );

    box-shadow:
        0 0 12px
        rgba(
            255,
            230,
            0,
            .9
        );

    z-index:20;

    will-change:transform;
}


/* =========================
   MUZZLE FLASH
========================= */

.muzzle{
    position:absolute;

    width:26px;
    height:26px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff,
            #ffe600 35%,
            rgba(
                255,
                80,
                0,
                0
            )
        );

    opacity:0;

    pointer-events:none;

    z-index:30;
}

.flash{
    animation:
        muzzleFlash
        .11s
        linear;
}

@keyframes muzzleFlash{

    0%{
        opacity:0;
        transform:scale(.35);
    }

    50%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:0;
        transform:scale(1.5);
    }

}


/* =========================
   EXPLOSION
========================= */

.explosion{
    position:absolute;

    width:46px;
    height:46px;

    border:
        4px solid
        #ffd84d;

    border-radius:50%;

    pointer-events:none;

    z-index:25;

    animation:
        explode
        .28s
        ease-out
        forwards;
}

@keyframes explode{

    0%{
        opacity:1;
        transform:scale(.2);
    }

    100%{
        opacity:0;
        transform:scale(1.55);
    }

}


/* =========================
   MESSAGE
========================= */

.message{
    min-height:30px;

    margin:
        13px
        0
        7px;

    color:#ffd84d;

    font-weight:800;
}


/* =========================
   BUTTONS
========================= */

.actions{
    display:flex;

    justify-content:center;

    gap:8px;

    flex-wrap:wrap;
}

.btn{
    border:0;

    border-radius:10px;

    background:
        var(--green);

    color:#071008;

    padding:
        13px
        20px;

    min-width:145px;

    font-size:16px;

    font-weight:900;

    cursor:pointer;
}

.btn.secondary{
    background:#263229;

    color:#fff;

    border:
        1px solid
        #405644;
}

.help{

    color:#8f9891;

    margin-top:10px;

    font-size:14px;
}


@media(max-width:450px){

    .btn{
        width:100%;

        max-width:180px;
    }

}

</style>

</head>

<body>

<header>

<a href="games.html">
← Back to Games
</a>

</header>


<div class="page">


<h1>
🧟 Zombie Attack
</h1>


<p class="subtitle">
Swipe left/right — every swipe fires automatically!
</p>


<div class="stats">


<div class="stat">
🎯 Score:
<span id="score">0</span>
</div>


<div class="stat">
❤️ Lives:
<span id="lives">3</span>
</div>


<div class="stat">
⚡ Wave:
<span id="wave">1</span>
</div>


<div class="stat">
🥇 Best:
<span id="best">0</span>
</div>


</div>


<div
class="best"
id="bestText"
>
🥇 Best Player: Nobody yet
</div>


<div class="game-frame">


<div
class="game-box"
id="gameBox"
>

<div class="moon">
</div>


<div class="ground">
</div>


<div class="ground-line g1">
</div>

<div class="ground-line g2">
</div>

<div class="ground-line g3">
</div>


<!-- PLAYER -->

<div
class="player"
id="player"
>

<div class="player-head">
</div>

<div class="player-shoulder">
</div>

<div class="player-body">
</div>

<div class="player-gun">
</div>

<div class="player-hand">
</div>

<div
class="player-hand right"
>
</div>

</div>


<div
class="muzzle"
id="muzzle"
>
</div>


</div>


<div
class="message"
id="message"
>
Press START GAME to begin!
</div>


<div class="actions">

<button
class="btn"
onclick="startGame()"
>
▶ START GAME
</button>


<button
class="btn secondary"
onclick="restartGame()"
>
↻ RESTART
</button>

</div>


<p class="help">
📱 Mobile: swipe left/right = move + fire
<br>
💻 PC: ← → move • SPACE fire
</p>


</div>


</div>


<script>


/* =========================
   ELEMENTS
========================= */

const gameBox =
document.getElementById(
    "gameBox"
);

const player =
document.getElementById(
    "player"
);

const muzzle =
document.getElementById(
    "muzzle"
);


/* =========================
   GAME STATE
========================= */

let playerX=180;

let targetX=180;

let score=0;

let lives=3;

let wave=1;

let running=false;

let animationId=null;

let spawnTimer=null;

let lastTime=0;

let lastShot=0;


let zombies=[];

let bullets=[];


let touchStartX=0;

let touchStartY=0;


let best=
Number(
    localStorage.getItem(
        "ebadZombieBest"
    )
)||0;


let bestPlayer=
localStorage.getItem(
    "ebadZombieBestPlayer"
)||"";


const lanes=[
    70,
    180,
    290
];


/* =========================
   STARS
========================= */

function createStars(){

    for(
        let i=0;
        i<65;
        i++
    ){

        const star=
            document.createElement(
                "div"
            );

        star.className=
            "star";

        star.style.left=
            Math.random()*
            100+
            "%";

        star.style.top=
            Math.random()*
            100+
            "%";

        star.style.opacity=
            .25+
            Math.random()*
            .7;

        gameBox.appendChild(
            star
        );

    }

}


/* =========================
   BEST
========================= */

function updateBest(){

    document.getElementById(
        "best"
    ).textContent=
        best;


    document.getElementById(
        "bestText"
    ).textContent=
        best>0 &&
        bestPlayer
        ?

        "🥇 Best Player: "+
        bestPlayer+
        " — "+
        best

        :

        "🥇 Best Player: Nobody yet";

}

updateBest();


/* =========================
   STATS
========================= */

function updateStats(){

    document.getElementById(
        "score"
    ).textContent=
        score;

    document.getElementById(
        "lives"
    ).textContent=
        lives;

    document.getElementById(
        "wave"
    ).textContent=
        wave;

}


/* =========================
   PLAYER
========================= */

function updatePlayer(){

    player.style.transform=
        "translate3d("+
        (
            playerX-
            180
        )+
        "px,0,0)";

}


function smoothPlayer(){

    const difference=
        targetX-
        playerX;

    playerX +=
        difference*
        .2;

    player.style.transform=
        "translate3d("+
        (
            playerX-
            180
        )+
        "px,0,0)";

}


/* =========================
   START
========================= */

function startGame(){

    if(running){
        return;
    }


    score=0;

    lives=3;

    wave=1;

    playerX=180;

    targetX=180;


    zombies=[];

    bullets=[];


    clearTimers();

    removeObjects();


    running=true;


    updateStats();

    updatePlayer();


    document.getElementById(
        "message"
    ).textContent=
        "🧟 Zombies are coming!";


    lastTime=
        performance.now();


    animationId=
        requestAnimationFrame(
            gameLoop
        );


    startSpawning();

}


/* =========================
   SPAWN
========================= */

function spawnSpeed(){

    return Math.max(
        430,
        850-
        (wave-1)*
        65
    );

}


function startSpawning(){

    spawnTimer=
        setInterval(
            spawnZombie,
            spawnSpeed()
        );

}


function restartSpawning(){

    clearInterval(
        spawnTimer
    );

    startSpawning();

}


function spawnZombie(){

    if(!running){
        return;
    }


    const x=
        lanes[
            Math.floor(
                Math.random()*
                lanes.length
            )
        ];


    const zombie=
        document.createElement(
            "div"
        );


    zombie.className=
        "zombie";


    zombie.innerHTML=`

        <div class="zombie-head">

            <div class="eye left">
            </div>

            <div class="eye right">
            </div>

        </div>


        <div class="zombie-body">
        </div>


        <div class="zombie-arm left">
        </div>


        <div class="zombie-arm right">
        </div>

    `;


    zombie.style.left=
        (
            x-
            31
        )+
        "px";


    zombie.style.top=
        "-95px";


    gameBox.appendChild(
        zombie
    );


    zombies.push({

        element:zombie,

        x:x,

        y:-95,

        speed:
            1.2+
            wave*.16

    });

}


/* =========================
   FIRE
========================= */

function fire(){

    if(!running){
        return;
    }


    const now=
        performance.now();


    if(
        now-
        lastShot<
        120
    ){

        return;
    }


    lastShot=
        now;


    const bullet=
        document.createElement(
            "div"
        );


    bullet.className=
        "bullet";


    bullet.style.left=
        (
            playerX-
            3
        )+
        "px";


    bullet.style.top=
        "390px";


    gameBox.appendChild(
        bullet
    );


    bullets.push({

        element:bullet,

        x:playerX,

        y:390

    });


    muzzle.style.left=
        (
            playerX-
            13
        )+
        "px";


    muzzle.style.top=
        "365px";


    muzzle.classList.remove(
        "flash"
    );


    void muzzle.offsetWidth;


    muzzle.classList.add(
        "flash"
    );

}


/* =========================
   SWIPE MOVE
========================= */

function moveLeft(){

    if(!running){
        return;
    }


    targetX-=55;


    if(
        targetX<55
    ){
        targetX=55;
    }


    /* swipe also fires */

    fire();

}


function moveRight(){

    if(!running){
        return;
    }


    targetX+=55;


    if(
        targetX>305
    ){
        targetX=305;
    }


    /* swipe also fires */

    fire();

}


/* =========================
   MAIN LOOP
========================= */

function gameLoop(time){

    if(!running){
        return;
    }


    const delta=
        Math.min(
            (
                time-
                lastTime
            )/
            16.67,
            2
        );


    lastTime=
        time;


    smoothPlayer();

    moveBullets(
        delta
    );

    moveZombies(
        delta
    );

    checkHits();


    animationId=
        requestAnimationFrame(
            gameLoop
        );

}


/* =========================
   BULLETS
========================= */

function moveBullets(delta){

    for(
        let i=
            bullets.length-
            1;

        i>=0;

        i--
    ){

        const b=
            bullets[i];


        b.y-=
            11*
            delta;


        b.element.style.transform=
            "translate3d(0,"+
            b.y+
            "px,0)";


        if(
            b.y<
            -40
        ){

            removeBullet(i);

        }

    }

}


/* =========================
   ZOMBIES
========================= */

function moveZombies(delta){

    for(
        let i=
            zombies.length-
            1;

        i>=0;

        i--
    ){

        const z=
            zombies[i];


        z.y+=
            z.speed*
            delta;


        z.element.style.transform=
            "translate3d(0,"+
            z.y+
            "px,0)";


        if(
            z.y>
            365
        ){

            const distance=
                Math.abs(
                    z.x-
                    playerX
                );


            if(
                distance<
                58
            ){

                removeZombie(i);

                lives--;

                updateStats();


                document.getElementById(
                    "message"
                ).textContent=
                    "💥 Zombie hit you!";


                if(
                    lives<=0
                ){

                    gameOver();

                    return;
                }

            }

        }


        if(
            z.y>
            570
        ){

            removeZombie(i);

        }

    }

}


/* =========================
   HIT DETECTION
========================= */

function checkHits(){

    for(
        let bi=
            bullets.length-
            1;

        bi>=0;

        bi--
    ){

        const b=
            bullets[bi];


        for(
            let zi=
                zombies.length-
                1;

            zi>=0;

            zi--
        ){

            const z=
                zombies[zi];


            const dx=
                b.x-
                z.x;


            const dy=
                b.y-
                (
                    z.y+
                    36
                );


            const distance=
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(
                distance<
                44
            ){

                createExplosion(
                    z.x,
                    z.y+
                    35
                );


                removeBullet(
                    bi
                );


                removeZombie(
                    zi
                );


                score++;


                updateWave();

                updateStats();


                document.getElementById(
                    "message"
                ).textContent=
                    "💥 Zombie destroyed!";


                break;

            }

        }

    }

}


/* =========================
   WAVE
========================= */

function updateWave(){

    const newWave=
        Math.floor(
            score/
            10
        )+
        1;


    if(
        newWave !==
        wave
    ){

        wave=
            newWave;


        restartSpawning();


        document.getElementById(
            "message"
        ).textContent=
            "⚡ WAVE "+
            wave+
            "!";

    }

}


/* =========================
   EXPLOSION
========================= */

function createExplosion(
    x,
    y
){

    const effect=
        document.createElement(
            "div"
        );


    effect.className=
        "explosion";


    effect.style.left=
        (
            x-
            23
        )+
        "px";


    effect.style.top=
        (
            y-
            23
        )+
        "px";


    gameBox.appendChild(
        effect
    );


    setTimeout(
        function(){

            effect.remove();

        },
        300
    );

}


/* =========================
   REMOVE
========================= */

function removeZombie(
    index
){

    if(
        !zombies[index]
    ){
        return;
    }


    zombies[index]
        .element
        .remove();


    zombies.splice(
        index,
        1
    );

}


function removeBullet(
    index
){

    if(
        !bullets[index]
    ){
        return;
    }


    bullets[index]
        .element
        .remove();


    bullets.splice(
        index,
        1
    );

}


function removeObjects(){

    zombies.forEach(
        function(z){

            z.element.remove();

        }
    );


    bullets.forEach(
        function(b){

            b.element.remove();

        }
    );


    zombies=[];

    bullets=[];

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running=false;


    clearTimers();


    if(
        animationId
    ){

        cancelAnimationFrame(
            animationId
        );

    }


    if(
        score>
        best
    ){

        best=
            score;


        bestPlayer=
            "Player";


        localStorage.setItem(
            "ebadZombieBest",
            best
        );


        localStorage.setItem(
            "ebadZombieBestPlayer",
            bestPlayer
        );


        updateBest();


        document.getElementById(
            "message"
        ).textContent=
            "🏆 NEW HIGH SCORE! "+
            score;

    }else{

        document.getElementById(
            "message"
        ).textContent=
            "💀 GAME OVER! Score: "+
            score;

    }

}


/* =========================
   RESTART
========================= */

function restartGame(){

    running=false;


    clearTimers();


    if(
        animationId
    ){

        cancelAnimationFrame(
            animationId
        );

    }


    score=0;

    lives=3;

    wave=1;

    playerX=180;

    targetX=180;


    removeObjects();


    updatePlayer();

    updateStats();


    document.getElementById(
        "message"
    ).textContent=
        "Press START GAME to begin!";

}


/* =========================
   TIMERS
========================= */

function clearTimers(){

    clearInterval(
        spawnTimer
    );

}


/* =========================
   MOBILE SWIPE
========================= */

gameBox.addEventListener(
    "touchstart",
    function(e){

        if(!running){
            return;
        }


        const touch=
            e.touches[0];


        touchStartX=
            touch.clientX;


        touchStartY=
            touch.clientY;

    },
    {
        passive:true
    }
);


gameBox.addEventListener(
    "touchend",
    function(e){

        if(!running){
            return;
        }


        const touch=
            e.changedTouches[0];


        const dx=
            touch.clientX-
            touchStartX;


        const dy=
            touch.clientY-
            touchStartY;


        /*
          Only horizontal swipe.
          Every valid swipe moves
          AND automatically fires.
        */

        if(
            Math.abs(dx)>
            30 &&

            Math.abs(dx)>
            Math.abs(dy)
        ){

            if(
                dx<0
            ){

                moveLeft();

            }else{

                moveRight();

            }

        }

    },
    {
        passive:true
    }
);


/* =========================
   PC CONTROLS
========================= */

document.addEventListener(
    "keydown",
    function(e){

        const typing=
            document.activeElement &&
            (
                document.activeElement.tagName===
                "INPUT" ||
                document.activeElement.tagName===
                "TEXTAREA"
            );


        if(
            typing
        ){
            return;
        }


        if(
            e.key===
            "ArrowLeft"
        ){

            e.preventDefault();

            moveLeft();

        }


        if(
            e.key===
            "ArrowRight"
        ){

            e.preventDefault();

            moveRight();

        }


        if(
            e.code===
            "Space"
        ){

            e.preventDefault();

            fire();

        }

    }
);


/* INITIAL */

createStars();

updatePlayer();

updateStats();

updateBest();

</script>
