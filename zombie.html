<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Attack - Ebad Gaming</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#070907;
    color:white;
    text-align:center;
}

header{
    background:#11151a;
    padding:16px;
    border-bottom:2px solid #35e05a;
}

header a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

h1{
    color:#35e05a;
    margin:20px 0 10px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:15px;
}

.stat{
    background:#151c16;
    border:1px solid #29452f;
    border-radius:10px;
    padding:9px 14px;
    font-weight:bold;
}

#gameCanvas{
    display:block;
    width:360px;
    height:540px;
    max-width:92vw;
    margin:15px auto;
    background:#101810;
    border:4px solid #35e05a;
    border-radius:14px;
    touch-action:none;
}

.message{
    min-height:28px;
    color:#ffd84d;
    font-weight:bold;
    margin:10px;
}

button{
    border:0;
    border-radius:9px;
    background:#35e05a;
    color:#071008;
    padding:12px 18px;
    margin:5px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    filter:brightness(1.1);
}

.controls{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:10px;
}

.control{
    width:80px;
    height:55px;
    font-size:24px;
}

.help{
    color:#aaa;
    margin:10px 0 25px;
}
</style>
</head>

<body>

<header>
    <a href="index.html">← Back to Ebad Gaming</a>
</header>

<h1>🧟 Zombie Attack</h1>

<div class="stats">
    <div class="stat">
        🎯 Score: <span id="score">0</span>
    </div>

    <div class="stat">
        ❤️ Lives: <span id="lives">3</span>
    </div>

    <div class="stat">
        ⚡ Wave: <span id="wave">1</span>
    </div>
</div>

<canvas id="gameCanvas" width="360" height="540"></canvas>

<div class="message" id="message">
    Press START to begin!
</div>

<button onclick="startGame()">START GAME</button>
<button onclick="restartGame()">RESTART</button>

<div class="controls">
    <button class="control" onclick="moveLeft()">⬅️</button>
    <button class="control" onclick="shoot()">🔫</button>
    <button class="control" onclick="moveRight()">➡️</button>
</div>

<p class="help">
    Computer: ← → to move, SPACE to shoot<br>
    Mobile: ⬅️ ➡️ move &nbsp; | &nbsp; 🔫 shoot
</p>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

let playerX = WIDTH / 2;

let score = 0;
let lives = 3;
let wave = 1;

let running = false;

let bullets = [];
let zombies = [];

let lastTime = 0;
let spawnTimer = 0;

let spawnInterval = 900;
let zombieSpeed = 75;

let animationId = null;

/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground(){

    ctx.fillStyle = "#101810";
    ctx.fillRect(0,0,WIDTH,HEIGHT);

    /* grid */

    ctx.strokeStyle = "#172117";
    ctx.lineWidth = 2;

    for(let x=0; x<WIDTH; x+=60){
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,HEIGHT);
        ctx.stroke();
    }

    for(let y=0; y<HEIGHT; y+=60){
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(WIDTH,y);
        ctx.stroke();
    }

    /* ground */

    ctx.fillStyle = "#162216";
    ctx.fillRect(0,500,WIDTH,40);
}


/* =========================
   DRAW PLAYER + GUN
========================= */

function drawPlayer(){

    /* body */

    ctx.fillStyle = "#35e05a";

    ctx.fillRect(
        playerX - 22,
        470,
        44,
        38
    );

    /* head */

    ctx.fillStyle = "#f3c8a8";

    ctx.beginPath();

    ctx.arc(
        playerX,
        451,
        13,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* gun pointing UP */

    ctx.fillStyle = "#bdbdbd";

    ctx.fillRect(
        playerX - 4,
        395,
        8,
        45
    );

    /* gun top */

    ctx.fillStyle = "#444";

    ctx.fillRect(
        playerX - 8,
        388,
        16,
        10
    );

    /* gun handle */

    ctx.fillStyle = "#222";

    ctx.fillRect(
        playerX - 8,
        430,
        16,
        22
    );
}


/* =========================
   DRAW ZOMBIE
========================= */

function drawZombie(z){

    ctx.font = "42px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        "🧟",
        z.x,
        z.y
    );
}


/* =========================
   DRAW BULLET
========================= */

function drawBullet(b){

    ctx.fillStyle = "#ffe600";

    ctx.shadowColor = "#ffe600";
    ctx.shadowBlur = 12;

    ctx.fillRect(
        b.x - 3,
        b.y - 10,
        6,
        20
    );

    ctx.shadowBlur = 0;
}


/* =========================
   SPAWN ZOMBIE
========================= */

function spawnZombie(){

    const zombie = {

        x: 25 + Math.random() * 310,

        y: -35

    };

    zombies.push(zombie);
}


/* =========================
   START GAME
========================= */

function startGame(){

    if(running){
        return;
    }

    score = 0;
    lives = 3;
    wave = 1;

    playerX = WIDTH / 2;

    bullets = [];
    zombies = [];

    spawnInterval = 900;
    zombieSpeed = 75;

    spawnTimer = 0;

    running = true;

    updateStats();

    document.getElementById("message").textContent =
        "🧟 Zombies are coming!";

    lastTime = performance.now();

    animationId =
        requestAnimationFrame(gameLoop);
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(time){

    if(!running){
        return;
    }

    const delta =
        Math.min(
            (time - lastTime) / 1000,
            0.05
        );

    lastTime = time;

    update(delta);
    draw();

    animationId =
        requestAnimationFrame(gameLoop);
}


/* =========================
   UPDATE GAME
========================= */

function update(delta){

    /* spawn zombies */

    spawnTimer += delta * 1000;

    if(spawnTimer >= spawnInterval){

        spawnTimer = 0;

        spawnZombie();
    }


    /* move zombies DOWN */

    for(let i = zombies.length - 1; i >= 0; i--){

        const z = zombies[i];

        z.y += zombieSpeed * delta;


        if(z.y >= 445){

            zombies.splice(i,1);

            lives--;

            updateStats();

            if(lives <= 0){

                gameOver();

                return;

            }

            document.getElementById("message").textContent =
                "💥 A zombie reached you!";
        }
    }


    /* move bullets UP */

    for(let i = bullets.length - 1; i >= 0; i--){

        const b = bullets[i];

        b.y -= 450 * delta;


        if(b.y < -20){

            bullets.splice(i,1);
        }
    }


    /* bullet hits zombie */

    for(
        let bi = bullets.length - 1;
        bi >= 0;
        bi--
    ){

        const bullet =
            bullets[bi];

        let hit = false;


        for(
            let zi = zombies.length - 1;
            zi >= 0;
            zi--
        ){

            const zombie =
                zombies[zi];


            const dx =
                bullet.x - zombie.x;

            const dy =
                bullet.y - zombie.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if(distance < 28){

                bullets.splice(bi,1);

                zombies.splice(zi,1);

                score++;

                hit = true;

                updateStats();

                updateWave();

                document.getElementById("message").textContent =
                    "💥 Zombie destroyed!";

                break;
            }
        }

        if(hit){
            continue;
        }
    }
}


/* =========================
   DRAW EVERYTHING
========================= */

function draw(){

    drawBackground();

    for(const z of zombies){

        drawZombie(z);
    }

    for(const b of bullets){

        drawBullet(b);
    }

    drawPlayer();
}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(!running){
        return;
    }

    bullets.push({

        x: playerX,

        y: 425

    });
}


/* =========================
   MOVE LEFT
========================= */

function moveLeft(){

    if(!running){
        return;
    }

    playerX -= 30;

    if(playerX < 25){

        playerX = 25;
    }
}


/* =========================
   MOVE RIGHT
========================= */

function moveRight(){

    if(!running){
        return;
    }

    playerX += 30;

    if(playerX > WIDTH - 25){

        playerX = WIDTH - 25;
    }
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "ArrowLeft"){

            event.preventDefault();

            moveLeft();
        }


        if(event.key === "ArrowRight"){

            event.preventDefault();

            moveRight();
        }


        if(event.code === "Space"){

            event.preventDefault();

            shoot();
        }

    }
);


/* =========================
   LEVEL / WAVE
========================= */

function updateWave(){

    const newWave =
        Math.floor(score / 10) + 1;


    if(newWave !== wave){

        wave = newWave;

        zombieSpeed =
            75 + (wave - 1) * 18;

        spawnInterval =
            Math.max(
                350,
                900 - (wave - 1) * 80
            );

        document.getElementById("message").textContent =
            "⚡ WAVE " +
            wave +
            "! Zombies faster!";
    }
}


/* =========================
   UPDATE STATS
========================= */

function updateStats(){

    document.getElementById("score").textContent =
        score;

    document.getElementById("lives").textContent =
        lives;

    document.getElementById("wave").textContent =
        wave;
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running = false;

    if(animationId){

        cancelAnimationFrame(
            animationId
        );
    }

    document.getElementById("message").textContent =
        "💀 GAME OVER! Score: " +
        score;
}


/* =========================
   RESTART
========================= */

function restartGame(){

    if(animationId){

        cancelAnimationFrame(
            animationId
        );
    }

    running = false;

    bullets = [];
    zombies = [];

    score = 0;
    lives = 3;
    wave = 1;

    playerX =
        WIDTH / 2;

    spawnTimer = 0;

    spawnInterval = 900;
    zombieSpeed = 75;

    updateStats();

    draw();

    document.getElementById("message").textContent =
        "Press START to begin!";
}


/* Initial screen */

updateStats();
draw();

</script>

</body>
</html>
