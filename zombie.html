<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zombie Attack - Ebad Gaming</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a08;color:#fff;font-family:Arial,sans-serif;text-align:center}header{background:#11151a;padding:16px;border-bottom:2px solid #35e05a}header a{color:#fff;text-decoration:none;font-weight:bold}h1{color:#35e05a;margin:20px 0 10px}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px}.stat{background:#151c16;border:1px solid #29452f;border-radius:10px;padding:9px 14px;font-weight:bold}#gameCanvas{display:block;width:360px;height:540px;max-width:92vw;margin:15px auto;background:#101810;border:4px solid #35e05a;border-radius:14px;touch-action:none}.message{min-height:28px;color:#ffd84d;font-weight:bold;margin:10px}button{border:0;border-radius:9px;background:#35e05a;color:#071008;padding:12px 18px;margin:5px;font-size:16px;font-weight:bold;cursor:pointer}.controls{display:flex;justify-content:center;gap:18px;margin:8px 0}.control{width:80px;height:55px;font-size:24px}.help{color:#aaa;margin:10px 0 24px}
</style></head>
<body>
<header><a href="index.html">← Back to Ebad Gaming</a></header>
<h1>🧟 Zombie Attack</h1>
<div class="stats"><div class="stat">🎯 Score: <span id="score">0</span></div><div class="stat">❤️ Lives: <span id="lives">3</span></div><div class="stat">⚡ Wave: <span id="wave">1</span></div></div>
<canvas id="gameCanvas" width="360" height="540"></canvas>
<div class="message" id="message">Press START to begin!</div>
<button onclick="startGame()">START GAME</button><button onclick="restartGame()">RESTART</button>
<div class="controls"><button class="control" onclick="moveLeft()">⬅️</button><button class="control" onclick="shoot()">🔫</button><button class="control" onclick="moveRight()">➡️</button></div>
<p class="help">Computer: ← → to move, SPACE to shoot<br>Mobile: ⬅️ ➡️ move | 🔫 shoot</p>
<script>
const canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d"),W=360,H=540;
let playerX=180,score=0,lives=3,wave=1,running=false,bullets=[],zombies=[],lastTime=0,spawnTimer=0,spawnInterval=800,zombieSpeed=75,animationId=null;
function stats(){document.getElementById("score").textContent=score;document.getElementById("lives").textContent=lives;document.getElementById("wave").textContent=wave}
function drawBG(){ctx.fillStyle="#101810";ctx.fillRect(0,0,W,H);ctx.strokeStyle="#172117";ctx.lineWidth=2;for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle="#162216";ctx.fillRect(0,500,W,40)}
function drawPlayer(){ctx.fillStyle="#35e05a";ctx.fillRect(playerX-22,470,44,38);ctx.fillStyle="#f3c8a8";ctx.beginPath();ctx.arc(playerX,451,13,0,Math.PI*2);ctx.fill();ctx.fillStyle="#bdbdbd";ctx.fillRect(playerX-4,395,8,45);ctx.fillStyle="#444";ctx.fillRect(playerX-8,388,16,10);ctx.fillStyle="#222";ctx.fillRect(playerX-8,430,16,22)}
function drawZombie(z){ctx.font="42px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("🧟",z.x,z.y)}
function drawBullet(b){ctx.fillStyle="#ffe600";ctx.shadowColor="#ffe600";ctx.shadowBlur=12;ctx.fillRect(b.x-3,b.y-10,6,20);ctx.shadowBlur=0}
function spawnZombie(){zombies.push({x:25+Math.random()*310,y:-35})}
function shoot(){if(running)bullets.push({x:playerX,y:425})}
function startGame(){if(running)return;score=0;lives=3;wave=1;playerX=180;bullets=[];zombies=[];spawnTimer=0;spawnInterval=800;zombieSpeed=75;running=true;stats();document.getElementById("message").textContent="🧟 Zombies are coming!";lastTime=performance.now();animationId=requestAnimationFrame(loop)}
function loop(t){if(!running)return;const dt=Math.min((t-lastTime)/1000,.05);lastTime=t;update(dt);draw();animationId=requestAnimationFrame(loop)}
function update(dt){spawnTimer+=dt*1000;if(spawnTimer>=spawnInterval){spawnTimer=0;spawnZombie()}for(let i=zombies.length-1;i>=0;i--){const z=zombies[i];z.y+=zombieSpeed*dt;if(z.y>=445){zombies.splice(i,1);lives--;stats();if(lives<=0){gameOver();return}document.getElementById("message").textContent="💥 A zombie reached you!"}}for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.y-=450*dt;if(b.y<-20)bullets.splice(i,1)}for(let bi=bullets.length-1;bi>=0;bi--){const b=bullets[bi];for(let zi=zombies.length-1;zi>=0;zi--){const z=zombies[zi],dx=b.x-z.x,dy=b.y-z.y;if(Math.sqrt(dx*dx+dy*dy)<28){bullets.splice(bi,1);zombies.splice(zi,1);score++;stats();wave=Math.floor(score/10)+1;zombieSpeed=75+(wave-1)*18;spawnInterval=Math.max(350,800-(wave-1)*70);document.getElementById("wave").textContent=wave;document.getElementById("message").textContent=score%10===0?"⚡ WAVE "+wave+"!":"💥 Zombie destroyed!";break}}}}
function draw(){drawBG();zombies.forEach(drawZombie);bullets.forEach(drawBullet);drawPlayer()}
function moveLeft(){if(running)playerX=Math.max(25,playerX-30)}
function moveRight(){if(running)playerX=Math.min(W-25,playerX+30)}
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){e.preventDefault();moveLeft()}if(e.key==="ArrowRight"){e.preventDefault();moveRight()}if(e.code==="Space"){e.preventDefault();shoot()}})
function gameOver(){running=false;if(animationId)cancelAnimationFrame(animationId);document.getElementById("message").textContent="💀 GAME OVER! Score: "+score}
function restartGame(){if(animationId)cancelAnimationFrame(animationId);running=false;bullets=[];zombies=[];score=0;lives=3;wave=1;playerX=180;spawnTimer=0;spawnInterval=800;zombieSpeed=75;stats();draw();document.getElementById("message").textContent="Press START to begin!"}
stats();draw();
</script></body></html>
